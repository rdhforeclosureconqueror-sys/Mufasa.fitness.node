name: Experiment Manager E6 QA handoff
on:
  pull_request:
    paths:
      - 'src/business-os/experiment-manager/**'
      - 'test/ai-business-os-experiment-manager-qa-handoff.test.js'
      - '.github/workflows/experiment-manager-e6-qa.yml'
jobs:
  qa-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/ai-business-os-experiment-manager-qa-handoff.test.js
      - run: npm run test:experiment-manager
