name: Anatomy premium contract
on:
  pull_request:
    paths:
      - 'public/anatomy-engine/**'
      - 'tests/anatomy-engine/**'
      - 'scripts/build-anatomy-exercise-index.mjs'
      - 'scripts/build-frontend.js'
      - 'src/exercise-intelligence/**'
      - 'data/exercise.json'
      - '.github/workflows/anatomy-premium-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-anatomy-exercise-index.mjs
      - run: node scripts/audit-anatomy-exercise-coverage.mjs
      - run: node --test tests/anatomy-engine/*.test.mjs
