name: Synthetic ownership guard
on:
  pull_request:
    paths:
      - 'src/services/syntheticRecordOwnershipGuard.js'
      - 'test/synthetic-record-ownership-guard.test.js'
      - '.github/workflows/synthetic-ownership-guard.yml'
jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/synthetic-record-ownership-guard.test.js test/full-production-journey-evidence.test.js
