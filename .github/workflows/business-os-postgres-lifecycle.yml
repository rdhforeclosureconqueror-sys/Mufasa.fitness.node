name: Business OS Postgres lifecycle
on:
  pull_request:
    paths:
      - 'src/business-os/organization/postgres-notification-lifecycle.js'
      - 'test/ai-business-os-postgres-lifecycle.test.js'
      - '.github/workflows/business-os-postgres-lifecycle.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/ai-business-os-postgres-lifecycle.test.js test/ai-business-os-postgres-notification-repository.test.js
