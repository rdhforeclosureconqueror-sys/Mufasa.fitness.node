name: Acceptance Lab visual Test Center
on:
  pull_request:
    paths:
      - 'public/admin-acceptance-lab.*'
      - 'test/business-os-acceptance-ui.test.js'
      - '.github/workflows/business-os-acceptance-ui.yml'
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/business-os-acceptance-ui.test.js
