name: Isolated CRM cleanup lifecycle
on:
  pull_request:
    paths:
      - 'scripts/acceptance-isolated-crm-cleanup.js'
      - 'test/acceptance-isolated-crm-cleanup.test.js'
      - '.github/workflows/isolated-crm-cleanup.yml'
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/acceptance-isolated-crm-cleanup.test.js test/synthetic-record-ownership-guard.test.js
