name: Stage Learning Pool Live Preview

on:
  push:
    branches:
      - deploy/learning-pool-live-20260915
    paths:
      - .github/workflows/stage-learning-pool-live.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-learning-pool-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: deploy/learning-pool-live-20260915
      GODOT_SOURCE_COMMIT: ef7966936892477a1fa1704a908ba3f336a170a4
      GODOT_CANDIDATE_COMMIT: d8b7c32d76461c48b639ca78be2f1138b68692a3
      PREVIEW_ROLLBACK_WEB_COMMIT: f10e78fa8cc66d06fc0fd643556d07a75b1b6063
      PREVIEW_ROLLBACK_GODOT_COMMIT: 7492057e951d863cb64125b20451643688e01bb1
    steps:
      - name: Checkout Web deployment branch
        uses: actions/checkout@v4
        with:
          ref: deploy/learning-pool-live-20260915

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Protect current arena, phone controls, and lobby
        run: node --test test/world-lobby-bridge.test.js test/arena-phone-flow.test.js test/arena-phone-ui.test.js test/arena-locomotion-mode.test.js

      - name: Fetch exact pool Godot candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mufasagodot-pool-candidate
          git clone --filter=blob:none --no-checkout \
            https://github.com/rdhforeclosureconqueror-sys/mufasagodot.git \
            /tmp/mufasagodot-pool-candidate
          git -C /tmp/mufasagodot-pool-candidate sparse-checkout init --cone
          git -C /tmp/mufasagodot-pool-candidate sparse-checkout set build/ci-web
          git -C /tmp/mufasagodot-pool-candidate checkout --detach "${GODOT_CANDIDATE_COMMIT}"
          test "$(git -C /tmp/mufasagodot-pool-candidate rev-parse HEAD)" = "${GODOT_CANDIDATE_COMMIT}"

      - name: Verify producer provenance and hashes
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=/tmp/mufasagodot-pool-candidate/build/ci-web
          for file in index.html index.js index.pck index.wasm BUILD_PROVENANCE.txt; do
            test -s "$CANDIDATE/$file"
          done
          grep -Fx "godot_source_commit=${GODOT_SOURCE_COMMIT}" "$CANDIDATE/BUILD_PROVENANCE.txt"
          (
            cd /tmp/mufasagodot-pool-candidate
            grep -E '^[0-9a-f]{64}  build/ci-web/(index.html|index.js|index.pck|index.wasm)$' build/ci-web/BUILD_PROVENANCE.txt | sha256sum -c -
          )

      - name: Stage exact runtime and write rollback-aware manifest
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=/tmp/mufasagodot-pool-candidate/build/ci-web
          ROOT=public/game/push-up-arena
          mkdir -p "$ROOT"
          cp "$CANDIDATE/index.html" "$ROOT/index.html"
          cp "$CANDIDATE/index.js" "$ROOT/index.js"
          cp "$CANDIDATE/index.pck" "$ROOT/index.pck"
          cp "$CANDIDATE/index.wasm" "$ROOT/index.wasm"
          cp "$CANDIDATE/BUILD_PROVENANCE.txt" /tmp/LEARNING_POOL_BUILD_PROVENANCE.txt
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          const root = 'public/game/push-up-arena';
          const info = name => {
            const data = fs.readFileSync(path.join(root, name));
            return {bytes:data.length, sha256:crypto.createHash('sha256').update(data).digest('hex')};
          };
          const source = process.env.GODOT_SOURCE_COMMIT;
          const candidate = process.env.GODOT_CANDIDATE_COMMIT;
          const provenance = fs.readFileSync('/tmp/LEARNING_POOL_BUILD_PROVENANCE.txt','utf8');
          const expected = {};
          for (const line of provenance.split(/\r?\n/)) {
            const m = line.match(/^([0-9a-f]{64})  build\/ci-web\/(index\.(?:html|js|pck|wasm))$/);
            if (m) expected[m[2]] = m[1];
          }
          for (const name of ['index.html','index.js','index.pck','index.wasm']) {
            const actual = info(name).sha256;
            if (!expected[name] || expected[name] !== actual) throw new Error(`Producer hash mismatch for ${name}`);
          }
          const html=info('index.html'), js=info('index.js'), pck=info('index.pck'), wasm=info('index.wasm');
          const manifest = {
            protocolVersion: 1,
            buildId: `learning-pool-preview-${source.slice(0,7)}-20260915`,
            godotVersion: '4.5.1',
            godotSourceCommit: source,
            godotCandidateCommit: candidate,
            producerHashVerification: 'pass',
            mainScene: 'res://Main.tscn',
            pckBytes:pck.bytes, pckSha256:pck.sha256,
            htmlBytes:html.bytes, htmlSha256:html.sha256,
            jsBytes:js.bytes, jsSha256:js.sha256,
            wasmBytes:wasm.bytes, wasmSha256:wasm.sha256,
            learningPoolPreview: {
              enabled: true,
              dimensionsMeters: [50,25],
              existingLocomotion: true,
              swimAnimation: 'pending',
              educationQuestions: 'pending',
              visualPhoneAcceptance: 'pending'
            },
            rollback: {
              webBranch: 'rollback/pre-learning-pool-live-20260915',
              webCommit: process.env.PREVIEW_ROLLBACK_WEB_COMMIT,
              godotBranch: 'rollback/pre-learning-pool-live-20260915',
              godotCommit: process.env.PREVIEW_ROLLBACK_GODOT_COMMIT
            },
            note: 'Exact hash-verified Godot learning-pool preview staged for private phone visual testing. Previous production Web and Godot states are pinned on rollback branches for immediate restoration if needed.'
          };
          fs.writeFileSync(path.join(root,'pocketpt-world-build.json'), JSON.stringify(manifest,null,2)+'\n');
          console.log(JSON.stringify(manifest,null,2));
          NODE

      - name: Commit staged learning-pool runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mufasagodot-pool-candidate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/game/push-up-arena/index.html \
            public/game/push-up-arena/index.js \
            public/game/push-up-arena/index.pck \
            public/game/push-up-arena/index.wasm \
            public/game/push-up-arena/pocketpt-world-build.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No runtime changes to stage."
            exit 0
          fi
          git commit -m "Stage learning pool Godot preview [skip ci]"
          git push origin HEAD:"${TARGET_BRANCH}"
