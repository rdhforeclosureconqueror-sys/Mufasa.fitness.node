name: Apply Multiplayer Diagnostic Review Fix

on:
  push:
    branches:
      - codex/add-multiplayer-diagnostics-and-failure-investigation
    paths:
      - .github/workflows/apply-multiplayer-diagnostic-review-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-multiplayer-diagnostics-and-failure-investigation
      - name: Apply review patch and run focused diagnostics tests
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_multiplayer_diagnostic_review_fix.py
          git diff --check
          node --test test/arena-diagnostics.test.js
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/arena-diagnostics.js test/arena-diagnostics.test.js
          git commit -m "Tighten multiplayer first-failure diagnostics"
          git push origin HEAD:codex/add-multiplayer-diagnostics-and-failure-investigation
