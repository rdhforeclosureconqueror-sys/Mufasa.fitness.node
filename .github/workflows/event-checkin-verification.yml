name: Event Check-In Verification
on:
  pull_request:
    paths:
      - 'public/event-checkin.js'
      - 'public/dashboard.html'
      - 'public/admin-members.html'
      - 'public/admin-event-checkins.html'
      - 'public/dashboard.js'
      - 'public/admin-event-checkins.js'
      - 'server.js'
      - 'src/services/event*.js'
      - 'src/billing/membershipTierBridge.js'
      - 'test/event-*.test.js'
      - '.github/workflows/event-checkin-verification.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test test/event-admin-navigation.test.js test/event-admin-auth-init.test.js
      - run: node --check server.js
      - run: node -e "require('./src/billing/membershipTierBridge').createMembershipTierBridge({env:{NODE_ENV:'test'},dataDir:require('node:fs').mkdtempSync(require('node:path').join(require('node:os').tmpdir(),'tier-bridge-smoke-'))})"
      - run: node --check public/event-checkin.js
      - run: node --check public/admin-event-checkins.js
      - run: node --check src/services/eventNotificationWorker.js
      - run: node --test test/event-checkin-store.test.js test/event-notification-queue.test.js test/event-notification-worker.test.js
