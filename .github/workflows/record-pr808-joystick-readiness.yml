name: Record PR808 Joystick Readiness

on:
  push:
    branches:
      - feat/arena-joystick-20260913
    paths:
      - .github/workflows/record-pr808-joystick-readiness.yml

permissions:
  contents: write

jobs:
  validate_and_record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR 808 branch
        uses: actions/checkout@v4
        with:
          ref: feat/arena-joystick-20260913

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Carry forward PR807 readiness audit
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/rdhforeclosureconqueror-sys/Mufasa.fitness.node/fix/walk-thriller-mobile-view-20260913/data/readiness/development-evidence.json" \
            -o data/readiness/development-evidence.json

      - name: Run joystick regressions
        run: node --test test/arena-locomotion-mode.test.js test/arena-phone-flow.test.js test/arena-phone-ui.test.js

      - name: Record joystick readiness evidence
        shell: bash
        env:
          READINESS_OPS_FILE: /tmp/pr808-readiness-ops.json
        run: |
          set -euo pipefail
          npm run readiness:update -- \
            --board avatar \
            --action evidence \
            --card avatar-development-pushup-arena-v1 \
            --files public/arena-phone-flow.js,public/arena-phone-ui.js,public/arena-push-up.html,public/game/push-up-arena/index.html,public/game/push-up-arena/index.pck,public/game/push-up-arena/pocketpt-world-build.json \
            --pr 808 \
            --commit 4f0b2d48549af62c6677291cf6ba1de3da9e475d \
            --result PASS \
            --sourceType implementation \
            --codeComplete true \
            --note "One-thumb 360 joystick implementation passed focused automated control/UI regressions and packages Godot source b1d5a8a7c478a711f80d2fcb2550bba67fcb4104 based on action-safe e863f914. Production phone joystick feel, diagonal steering, movement naturalness, and human UX acceptance remain pending authorized human verification."
          npm run readiness:validate

      - name: Commit joystick readiness audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/readiness/development-evidence.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "FIRST FAILURE: joystick readiness audit produced no staged change" >&2
            exit 1
          fi
          git commit -m "Record PR808 joystick readiness evidence [skip ci]"
          git push origin HEAD:feat/arena-joystick-20260913
