name: Community ID Card foundation
on:
  pull_request:
    paths:
      - 'src/services/communityCardService.js'
      - 'public/community-avatar.js'
      - 'public/community-avatar-diagnostics.js'
      - 'public/community-avatar-setup-mode.js'
      - 'public/community-gym-gateway.js'
      - 'public/push-up-release.html'
      - 'test/community-gym-entry-reuse.test.js'
      - 'test/community-native-avatar.test.js test/community-gym-entry-reuse.test.js'
      - 'src/routes/communityCardRoutes.js'
      - 'public/community-entrance.html'
      - 'public/community-entrance.js'
      - 'public/community-hub.html'
      - 'server.js'
      - 'config/route-authorization-contract.js'
      - 'test/community-card-foundation.test.js'
      - 'scripts/acceptance-community-card-http.js'
      - '.github/workflows/community-card-foundation.yml'
  workflow_dispatch:
jobs:
  community-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: npm ci --ignore-scripts
      - name: Static parse and targeted unit tests
        run: |
          node --check src/services/communityCardService.js
          node --check src/routes/communityCardRoutes.js
          node --check public/community-entrance.js
          node --check server.js
          node --check public/community-avatar.js
          node --check public/community-avatar-diagnostics.js
          node --check public/community-avatar-setup-mode.js
          node --check public/community-gym-gateway.js
          node --test test/community-card-foundation.test.js test/community-native-avatar.test.js
      - name: Isolated real HTTP registration, private card save and reload
        run: node scripts/acceptance-community-card-http.js
