name: Wellness trial source regression
on:
  pull_request:
    paths:
      - 'public/community-trial-offer.js'
      - 'test/community-trial-event-source.test.js'
      - '.github/workflows/wellness-trial-source.yml'
  workflow_dispatch:
jobs:
  trial-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify trial source redirects
        run: node --test test/community-trial-event-source.test.js
