name: Apply Arena Joystick

on:
  push:
    branches:
      - feat/arena-joystick-20260913
    paths:
      - .github/workflows/apply-arena-joystick.yml

permissions:
  contents: write

jobs:
  implement_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout joystick branch
        uses: actions/checkout@v4
        with:
          ref: feat/arena-joystick-20260913

      - name: Implement one-thumb 360 joystick
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit('FIRST FAILURE ' + label)
              p.write_text(text.replace(old, new, 1))

          flow_path = Path('public/arena-phone-flow.js')
          flow = flow_path.read_text()
          old = "    let movementMode = 'WALK';\n"
          new = "    let movementMode = 'WALK';\n    let movementVector = null;\n"
          if old not in flow: raise SystemExit('FIRST FAILURE flow movement state anchor missing')
          flow = flow.replace(old, new, 1)

          old = "    function release() {\n      clearRepeater(repeater); repeater = null; clearTimer(nudgeTimer); nudgeTimer = null; held = null;\n      control('STOP');\n    }\n"
          new_lines = [
              '    function pulseHeld() {',
              "      if (held === 'MOVE_VECTOR' && movementVector) return control('MOVE_VECTOR', {x: movementVector.x, y: movementVector.y, validForMs: 300});",
              "      if (DIRECTIONS.has(held)) return control(held, {intensity: 1, validForMs: 300});",
              '      return null;',
              '    }',
              '    function release() {',
              '      clearRepeater(repeater); repeater = null; clearTimer(nudgeTimer); nudgeTimer = null; held = null; movementVector = null;',
              "      control('STOP');",
              '    }',
          ]
          if old not in flow: raise SystemExit('FIRST FAILURE release block missing')
          flow = flow.replace(old, '\n'.join(new_lines) + '\n', 1)

          old = "    function hold(action) {\n      if (!snapshot().canMove || held || !DIRECTIONS.has(action)) return false;\n      held = action;\n      const pulse = () => control(action, {intensity: 1, validForMs: 300});\n      pulse(); repeater = setRepeater(pulse, 100); return true;\n    }\n"
          new_lines = [
              '    function hold(action) {',
              '      if (!snapshot().canMove || held || !DIRECTIONS.has(action)) return false;',
              '      held = action; movementVector = null;',
              '      pulseHeld(); repeater = setRepeater(pulseHeld, 100); return true;',
              '    }',
              '    function moveVector(x, y) {',
              '      if (!snapshot().canMove || !Number.isFinite(x) || !Number.isFinite(y) || Math.abs(x) > 1 || Math.abs(y) > 1) return false;',
              '      const magnitude = Math.hypot(x, y);',
              "      if (magnitude <= 0.12) { if (held === 'MOVE_VECTOR') release(); return true; }",
              "      if (held && held !== 'MOVE_VECTOR') return false;",
              '      movementVector = {x: x / magnitude, y: y / magnitude};',
              "      if (!held) { held = 'MOVE_VECTOR'; pulseHeld(); repeater = setRepeater(pulseHeld, 100); }",
              '      else pulseHeld();',
              '      return true;',
              '    }',
          ]
          if old not in flow: raise SystemExit('FIRST FAILURE hold block missing')
          flow = flow.replace(old, '\n'.join(new_lines) + '\n', 1)
          old = '    return {snapshot, connect, accept, hold, nudge, release, setLocomotionMode, playAction, approach, cancelApproach, setup,\n'
          new = '    return {snapshot, connect, accept, hold, nudge, moveVector, release, setLocomotionMode, playAction, approach, cancelApproach, setup,\n'
          if old not in flow: raise SystemExit('FIRST FAILURE flow export anchor missing')
          flow_path.write_text(flow.replace(old, new, 1))

          ui_path = Path('public/arena-phone-ui.js')
          ui = ui_path.read_text()
          old = "    function releasePointer() {\n      const held = pointer; pointer = null;\n      if (held?.element.hasPointerCapture?.(held.id)) held.element.releasePointerCapture(held.id);\n      flow.release();\n    }\n"
          new_lines = [
              '    function releasePointer() {',
              '      const held = pointer; pointer = null;',
              '      if (held?.element.hasPointerCapture?.(held.id)) held.element.releasePointerCapture(held.id);',
              "      const knob = $('arenaJoystickKnob'); if (knob) knob.style.transform = 'translate3d(0,0,0)';",
              '      flow.release();',
              '    }',
              '    function joystickVector(event) {',
              "      const joystick = $('arenaJoystick'), rect = joystick.getBoundingClientRect();",
              '      const radius = Math.max(1, Math.min(rect.width, rect.height) / 2);',
              '      let x = (event.clientX - (rect.left + rect.width / 2)) / radius;',
              '      let y = (event.clientY - (rect.top + rect.height / 2)) / radius;',
              '      const magnitude = Math.hypot(x, y);',
              '      if (magnitude > 1) { x /= magnitude; y /= magnitude; }',
              '      return {x, y};',
              '    }',
              '    function applyJoystick(event) {',
              '      const vector = joystickVector(event), radiusPx = 42;',
              "      $('arenaJoystickKnob').style.transform = `translate3d(${(vector.x * radiusPx).toFixed(1)}px, ${(vector.y * radiusPx).toFixed(1)}px, 0)`;",
              '      return flow.moveVector(vector.x, vector.y);',
              '    }',
          ]
          if old not in ui: raise SystemExit('FIRST FAILURE UI releasePointer block missing')
          ui = ui.replace(old, '\n'.join(new_lines) + '\n', 1)

          start = ui.find("    for (const button of panel.querySelectorAll('[data-arena-move]')) {")
          end_marker = "    $('arenaThumbStop').addEventListener('click', releasePointer);\n"
          end = ui.find(end_marker, start)
          if start < 0 or end < 0: raise SystemExit('FIRST FAILURE old directional control block missing')
          end += len(end_marker)
          replacement_lines = [
              "    const joystick = $('arenaJoystick');",
              "    const keyDirections = {ArrowLeft: 'MOVE_LEFT', ArrowRight: 'MOVE_RIGHT', ArrowUp: 'MOVE_FORWARD', ArrowDown: 'MOVE_BACKWARD'};",
              "    joystick.addEventListener('pointerdown', event => {",
              '      if (pointer || event.button !== 0 || !flow.snapshot().canMove) return;',
              '      event.preventDefault(); pointer = {id: event.pointerId, element: joystick};',
              '      try {joystick.setPointerCapture(event.pointerId);} catch (_) {releasePointer(); return;}',
              '      applyJoystick(event);',
              '    });',
              "    joystick.addEventListener('pointermove', event => {if (pointer?.id === event.pointerId) {event.preventDefault(); applyJoystick(event);}});",
              "    for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) joystick.addEventListener(name, event => {if (pointer?.id === event.pointerId) releasePointer();});",
              "    joystick.addEventListener('keydown', event => {",
              '      const action = keyDirections[event.key]; if (!action || event.repeat) return;',
              '      event.preventDefault(); flow.hold(action);',
              '    });',
              "    joystick.addEventListener('keyup', event => {if (keyDirections[event.key]) {event.preventDefault(); flow.release();}});",
          ]
          ui = ui[:start] + '\n'.join(replacement_lines) + '\n' + ui[end:]
          ui_path.write_text(ui)

          html_path = Path('public/arena-push-up.html')
          html = html_path.read_text()
          old_css = "    .thumb-controls{margin-top:12px;max-width:320px}\n    .thumb-controls summary{padding:12px 0;cursor:pointer}\n    .thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}\n    .thumb-grid button{touch-action:none;user-select:none;font-size:20px}\n    .thumb-grid .forward{grid-column:2}.thumb-grid .left{grid-column:1}.thumb-grid .back{grid-column:2}\n"
          new_css_lines = [
              '    .thumb-controls{margin-top:10px;max-width:360px}',
              '    .thumb-controls summary{padding:10px 0;cursor:pointer}',
              '    .joystick-wrap{display:grid;place-items:center;gap:8px}',
              '    .joystick{position:relative;width:154px;height:154px;border-radius:50%;touch-action:none;user-select:none;background:radial-gradient(circle at center,#1b2538 0 28%,#111827 29% 62%,#0a0f18 63%);border:2px solid #52617a;box-shadow:inset 0 0 0 1px #ffffff0d,0 8px 28px #0008}',
              '    .joystick::before,.joystick::after{content:"";position:absolute;background:#64748b55;pointer-events:none}',
              '    .joystick::before{left:50%;top:12%;bottom:12%;width:1px}',
              '    .joystick::after{top:50%;left:12%;right:12%;height:1px}',
              '    .joystick-knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:#ffd35a;border:3px solid #fff2a8;box-shadow:0 8px 18px #000a;pointer-events:none;transition:transform 45ms linear}',
              '    .joystick-hint{color:#aebbd0;font-size:12px;text-align:center;margin:0}',
          ]
          if old_css not in html: raise SystemExit('FIRST FAILURE old thumb CSS missing')
          html = html.replace(old_css, '\n'.join(new_css_lines) + '\n', 1)
          old_markup_lines = [
              '    <details id="arenaThumbControls" class="thumb-controls" hidden><summary>Move with thumb controls</summary>',
              '      <div class="thumb-grid" aria-label="Avatar movement">',
              '        <button type="button" class="forward" data-arena-move="MOVE_FORWARD" aria-label="Move forward">↑</button>',
              '        <button type="button" class="left" data-arena-move="MOVE_LEFT" aria-label="Move left">←</button>',
              '        <button type="button" id="arenaThumbStop" aria-label="Stop movement">■</button>',
              '        <button type="button" data-arena-move="MOVE_RIGHT" aria-label="Move right">→</button>',
              '        <button type="button" class="back" data-arena-move="MOVE_BACKWARD" aria-label="Move backward">↓</button>',
              '      </div>',
          ]
          old_markup = '\n'.join(old_markup_lines) + '\n'
          new_markup_lines = [
              '    <details id="arenaThumbControls" class="thumb-controls" hidden open><summary>Move with joystick</summary>',
              '      <div class="joystick-wrap">',
              '        <div id="arenaJoystick" class="joystick" role="application" tabindex="0" aria-label="Movement joystick. Drag in any direction and release to stop." aria-describedby="arenaJoystickHint">',
              '          <span id="arenaJoystickKnob" class="joystick-knob" aria-hidden="true"></span>',
              '        </div>',
              '        <p id="arenaJoystickHint" class="joystick-hint">Drag to move · release to stop</p>',
              '      </div>',
          ]
          if old_markup not in html: raise SystemExit('FIRST FAILURE old thumb markup missing')
          html = html.replace(old_markup, '\n'.join(new_markup_lines) + '\n', 1)
          html = html.replace('/arena-phone-flow.js?v=20260913-walk-facing-thriller-v2', '/arena-phone-flow.js?v=20260913-joystick-v1', 1)
          html = html.replace('/arena-phone-ui.js?v=20260913-walk-facing-thriller-v2', '/arena-phone-ui.js?v=20260913-joystick-v1', 1)
          html_path.write_text(html)

          flow_test_path = Path('test/arena-phone-flow.test.js')
          ft = flow_test_path.read_text()
          anchor = "test('mat arrival is correlated to the pending command and cannot be inferred from sending it', () => {\n"
          joystick_test_lines = [
              "test('360 joystick vectors preserve diagonal direction, refresh the lease, and release to STOP', () => {",
              '  const f = fixture(); f.capabilities();',
              '  assert.equal(f.flow.moveVector(0.6, -0.8), true);',
              "  assert.equal(f.sent.at(-1).action, 'MOVE_VECTOR');",
              '  assert.equal(f.sent.at(-1).x, 0.6); assert.equal(f.sent.at(-1).y, -0.8);',
              '  f.advance(250); assert.equal(f.sent.filter(x => x.action === \'MOVE_VECTOR\').length, 3);',
              '  assert.equal(f.flow.moveVector(-0.8, -0.6), true);',
              '  assert.ok(Math.abs(f.sent.at(-1).x + 0.8) < 1e-9); assert.ok(Math.abs(f.sent.at(-1).y + 0.6) < 1e-9);',
              '  f.flow.release(); assert.equal(f.sent.at(-1).action, \'STOP\');',
              '  assert.equal(f.flow.moveVector(2, 0), false);',
              '});',
              '',
          ]
          if anchor not in ft: raise SystemExit('FIRST FAILURE flow test insertion anchor missing')
          ft = ft.replace(anchor, '\n'.join(joystick_test_lines) + anchor, 1)
          flow_test_path.write_text(ft)

          ui_test_path = Path('test/arena-phone-ui.test.js')
          ut = ui_test_path.read_text()
          old = "      setPointerCapture(id) {this.pointerId = id;}, hasPointerCapture(id) {return this.pointerId === id;}, releasePointerCapture() {this.pointerId = null;}\n"
          new = "      setPointerCapture(id) {this.pointerId = id;}, hasPointerCapture(id) {return this.pointerId === id;}, releasePointerCapture() {this.pointerId = null;},\n      getBoundingClientRect() {return this.rect || {left:0,top:0,width:160,height:160};}\n"
          if old not in ut: raise SystemExit('FIRST FAILURE UI test node anchor missing')
          ut = ut.replace(old, new, 1)
          start = ut.find("test('thumb pointer cancellation stops movement and release-click cannot restart it'")
          end = ut.find("test('touch mat flow transfers focus", start)
          if start < 0 or end < 0: raise SystemExit('FIRST FAILURE old thumb test block missing')
          joy_test_lines = [
              "test('joystick pointer drag sends a 360 vector and release stops movement', async t => {",
              "  const f = fixture(t), joystick = f.nodes.get('arenaJoystick');",
              "  await joystick.fire('pointerdown', {button: 0, pointerId: 7, clientX: 128, clientY: 32, preventDefault() {}});",
              "  assert.equal(f.sent.at(-1).action, 'MOVE_VECTOR');",
              '  assert.ok(f.sent.at(-1).x > 0); assert.ok(f.sent.at(-1).y < 0);',
              "  await joystick.fire('pointermove', {pointerId: 7, clientX: 160, clientY: 80, preventDefault() {}});",
              '  assert.ok(f.sent.at(-1).x > 0.99); assert.ok(Math.abs(f.sent.at(-1).y) < 1e-9);',
              "  await joystick.fire('pointercancel', {pointerId: 7}); assert.equal(f.sent.at(-1).action, 'STOP');",
              '});',
              '',
          ]
          ut = ut[:start] + '\n'.join(joy_test_lines) + ut[end:]
          old = "test('blur and orientation change release a captured thumb control', async t => {\n  const f = fixture(t), button = f.nodes.get('MOVE_FORWARD');\n  for (const event of ['blur', 'orientationchange']) {\n    await button.fire('pointerdown', {button: 0, pointerId: 9, preventDefault() {}});\n    f.events.get(event)(); assert.equal(f.sent.at(-1).action, 'STOP');\n  }\n});\n"
          new_lines = [
              "test('blur and orientation change release a captured joystick', async t => {",
              "  const f = fixture(t), joystick = f.nodes.get('arenaJoystick');",
              "  for (const event of ['blur', 'orientationchange']) {",
              "    await joystick.fire('pointerdown', {button: 0, pointerId: 9, clientX: 80, clientY: 0, preventDefault() {}});",
              "    f.events.get(event)(); assert.equal(f.sent.at(-1).action, 'STOP');",
              '  }',
              '});',
          ]
          if old not in ut: raise SystemExit('FIRST FAILURE blur thumb test block missing')
          ut = ut.replace(old, '\n'.join(new_lines) + '\n', 1)
          old = "  for (const direction of ['left', 'right', 'forward', 'backward']) assert.ok(html.includes(`aria-label=\"Move ${direction}\"`));\n"
          new = "  assert.match(html, /id=\"arenaJoystick\"/); assert.match(html, /Drag in any direction and release to stop/);\n"
          if old not in ut: raise SystemExit('FIRST FAILURE accessibility assertion missing')
          ui_test_path.write_text(ut.replace(old, new, 1))

          mode_test_path = Path('test/arena-locomotion-mode.test.js')
          mt = mode_test_path.read_text()
          append_lines = [
              '',
              "test('phone movement UI uses a one-thumb 360 joystick while preserving Walk Run and Thriller controls', () => {",
              "  const html = fs.readFileSync(path.join(__dirname, '../public/arena-push-up.html'), 'utf8');",
              "  const ui = fs.readFileSync(path.join(__dirname, '../public/arena-phone-ui.js'), 'utf8');",
              "  const flow = fs.readFileSync(path.join(__dirname, '../public/arena-phone-flow.js'), 'utf8');",
              "  assert.match(html, /id=\"arenaJoystick\"/);",
              '  assert.doesNotMatch(html, /class="thumb-grid"/);',
              '  assert.match(ui, /flow\.moveVector/);',
              "  assert.match(flow, /'MOVE_VECTOR'/);",
              '});',
          ]
          mode_test_path.write_text(mt.rstrip() + '\n' + '\n'.join(append_lines) + '\n')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused joystick regressions
        run: node --test test/arena-phone-flow.test.js test/arena-phone-ui.test.js test/arena-locomotion-mode.test.js

      - name: Commit validated joystick UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/arena-phone-flow.js public/arena-phone-ui.js public/arena-push-up.html test/arena-phone-flow.test.js test/arena-phone-ui.test.js test/arena-locomotion-mode.test.js
          git diff --cached --check
          git commit -m "Add one-thumb 360 arena joystick [skip ci]"
          git push origin HEAD:feat/arena-joystick-20260913
