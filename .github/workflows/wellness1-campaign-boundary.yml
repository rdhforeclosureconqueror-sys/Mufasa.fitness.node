name: WELLNESS-1 campaign attribution boundary
on:
  pull_request:
    paths:
      - 'public/wellness-campaign-links.js'
      - 'public/event-checkin.js'
      - 'test/wellness1-campaign-navigation.test.js'
      - '.github/workflows/wellness1-campaign-boundary.yml'
  push:
    branches:
      - feature/wellness1-campaign-checkin-integrity
jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/wellness1-campaign-navigation.test.js
