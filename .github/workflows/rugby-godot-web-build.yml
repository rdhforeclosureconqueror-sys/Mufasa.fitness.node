name: Rugby HQ Godot Web build
on:
  pull_request:
    paths:
      - 'godot/rugby-hq-web/**'
      - '.github/workflows/rugby-godot-web-build.yml'
      - 'test/rugby-godot-web.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.classify.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ] && [ "$(git log -1 --format=%s)" = "Publish validated V8C Web candidate" ]; then
            changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^public/game/rugby-hq/'; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"
  compile-export:
    needs: classify
    if: needs.classify.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching Godot and Web export templates
        shell: bash
        run: |
          set -euo pipefail
          version=4.5.1-stable
          base="https://github.com/godotengine/godot-builds/releases/download/$version"
          curl --fail --location --retry 3 "$base/Godot_v${version}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 3 "$base/Godot_v${version}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${version}_linux.x86_64"
          sudo install "$RUNNER_TEMP/godot/Godot_v${version}_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          godot --version | grep '^4\.5\.1\.stable'
      - name: Import and compile project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path godot/rugby-hq-web --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR: Failed loading resource' "$RUNNER_TEMP/import.log"; then exit 1; fi
      - name: Smoke test Training and Playbook scenes
        shell: bash
        run: |
          set -euo pipefail
          for scene in res://scenes/training_drill.tscn res://playbook/playbook_arena.tscn; do
            godot --headless --path godot/rugby-hq-web --quit-after 120 "$scene" 2>&1 | tee "$RUNNER_TEMP/scene.log"
            if grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR: Failed loading resource' "$RUNNER_TEMP/scene.log"; then exit 1; fi
          done
      - name: Export Web candidate to temporary directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rugby-web"
          godot --headless --path godot/rugby-hq-web --export-release Web "$RUNNER_TEMP/rugby-web/index.html" 2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -Ei 'SCRIPT ERROR|Parse Error|ERROR:.*(export|resource)' "$RUNNER_TEMP/export.log"; then exit 1; fi
          test -s "$RUNNER_TEMP/rugby-web/index.wasm"
          test -s "$RUNNER_TEMP/rugby-web/index.pck"
          test -s "$RUNNER_TEMP/rugby-web/index.html"
      - name: Generate candidate manifest and run package contracts
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/rugby-web" <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
          const dir = process.argv[2];
          const original = JSON.parse(fs.readFileSync('public/game/rugby-hq/build-manifest.json','utf8'));
          const files = {};
          for (const name of fs.readdirSync(dir).sort()) {
            const file = path.join(dir,name);
            if (!fs.statSync(file).isFile()) continue;
            const data = fs.readFileSync(file);
            files[name] = {bytes:data.length,sha256:crypto.createHash('sha256').update(data).digest('hex')};
          }
          for (const name of Object.keys(original.files)) if (!files[name]) throw new Error('Missing exported asset: '+name);
          fs.writeFileSync(path.join(dir,'build-manifest.json'),JSON.stringify({...original,files},null,2)+'\n');
          NODE
          cp -a "$RUNNER_TEMP/rugby-web/." public/game/rugby-hq/
          node --test test/rugby-godot-web.test.js
      - name: Upload validated candidate only
        uses: actions/upload-artifact@v4
        with:
          name: rugby-hq-web-candidate
          path: ${{ runner.temp }}/rugby-web/
          if-no-files-found: error
          retention-days: 7

  publish-v8c-candidate:
    # Only this same-repository development branch can receive the candidate.
    # Never push main or execute PR source with a write token.
    if: needs.classify.outputs.build == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/rugby-v8c-mobile-cards' && github.event.pull_request.base.ref == 'main'
    needs: [classify, compile-export]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: rugby-hq-web-candidate
          path: ${{ runner.temp }}/validated-rugby
      - name: Verify and publish candidate to development branch only
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          branch=feat/rugby-v8c-mobile-cards
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          python3 - "$RUNNER_TEMP/validated-rugby" <<'PY'
          import hashlib,json,pathlib,sys,shutil
          src=pathlib.Path(sys.argv[1])
          dst=pathlib.Path('public/game/rugby-hq')
          manifest=json.loads((src/'build-manifest.json').read_text())
          expected=set(json.loads((dst/'build-manifest.json').read_text())['files'])
          if set(manifest['files']) != expected:
              raise SystemExit('Unexpected candidate asset list')
          for name, meta in manifest['files'].items():
              if pathlib.Path(name).name != name: raise SystemExit('Unsafe asset name')
              data=(src/name).read_bytes()
              if len(data)!=meta['bytes'] or hashlib.sha256(data).hexdigest()!=meta['sha256']:
                  raise SystemExit('Asset integrity failure: '+name)
              (dst/name).write_bytes(data)
          shutil.copyfile(src/'build-manifest.json',dst/'build-manifest.json')
          PY
          git add -- public/game/rugby-hq/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish validated V8C Web candidate"
          git push origin "HEAD:refs/heads/$branch"

  verify-published:
    needs: classify
    if: needs.classify.outputs.build == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify already-published package without rebuilding
        run: node --test test/rugby-godot-web.test.js
