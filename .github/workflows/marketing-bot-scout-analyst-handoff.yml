name: Marketing Bot Scout Analyst handoff
on:
  pull_request:
    paths:
      - 'scripts/marketing-bot-scout-analyst-handoff.js'
      - 'test/marketing-bot-scout-analyst-handoff.test.js'
      - '.github/workflows/marketing-bot-scout-analyst-handoff.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/marketing-bot-scout-analyst-handoff.test.js
