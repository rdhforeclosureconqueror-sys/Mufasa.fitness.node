name: Rugby policy dashboard registration
on:
  pull_request:
    paths:
      - '.github/workflows/rugby-policy-dashboard-registration.yml'
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Register canonical readiness card
        env:
          READINESS_OPS_FILE: ${{ runner.temp }}/readiness-ops.json
        run: |
          set -euo pipefail
          CARD=launch-development-rugby-beast-mode-evidence-integration
          if ! jq -e --arg id "$CARD" '.. | objects | select(.id? == $id)' data/readiness/development-cards.json >/dev/null; then
            npm run readiness:update -- --board launch --card "$CARD" --action create --title 'Beast Mode trusted evidence integration' --category 'RUGBY HQ' --description 'Reconcile trusted assessment evidence and programme records with Beast Mode candidate progression; no automatic progression or migration' --started true --current true --humanRequired true
          fi
          npm run readiness:validate
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-registration
          path: |
            data/readiness/development-cards.json
            data/readiness/development-evidence.json
          if-no-files-found: error
