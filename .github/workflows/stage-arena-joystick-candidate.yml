name: Stage Arena Joystick Candidate

on:
  push:
    branches:
      - feat/arena-joystick-20260913
    paths:
      - .github/workflows/stage-arena-joystick-candidate.yml

permissions:
  contents: write

jobs:
  test_and_stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout joystick web branch
        uses: actions/checkout@v4
        with:
          ref: feat/arena-joystick-20260913

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-run focused joystick regressions
        run: node --test test/arena-phone-flow.test.js test/arena-phone-ui.test.js test/arena-locomotion-mode.test.js

      - name: Wait for exact current-base Godot joystick candidate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            rm -rf /tmp/joystick-probe
            if git clone --depth 1 --filter=blob:none --sparse --branch generated/joystick-web-candidate https://github.com/rdhforeclosureconqueror-sys/mufasagodot.git /tmp/joystick-probe >/dev/null 2>&1; then
              git -C /tmp/joystick-probe sparse-checkout set build/joystick-ci-web >/dev/null 2>&1
              PROV=/tmp/joystick-probe/build/joystick-ci-web/BUILD_PROVENANCE.txt
              if [[ -s "$PROV" ]] && grep -Fx 'godot_base_commit=e863f91414ae786c7d773dd051ca71b16c1b26fe' "$PROV" >/dev/null && grep -Fx 'control=MOVE_VECTOR' "$PROV" >/dev/null; then
                echo 'Exact joystick candidate is ready.'
                exit 0
              fi
            fi
            echo "Waiting for current-base joystick export (${attempt}/60)..."
            sleep 10
          done
          echo 'FIRST FAILURE: exact current-base joystick candidate did not appear.' >&2
          exit 1

      - name: Fetch exact candidate and provenance
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=/tmp/joystick-probe/build/joystick-ci-web
          for file in index.html index.js index.pck index.wasm BUILD_PROVENANCE.txt; do test -s "$CANDIDATE/$file"; done
          SOURCE_SHA="$(sed -n 's/^godot_source_commit=//p' "$CANDIDATE/BUILD_PROVENANCE.txt" | head -n1)"
          test -n "$SOURCE_SHA"
          echo "GODOT_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          cp "$CANDIDATE/index.html" public/game/push-up-arena/index.html
          cp "$CANDIDATE/index.js" public/game/push-up-arena/index.js
          cp "$CANDIDATE/index.pck" public/game/push-up-arena/index.pck
          cp "$CANDIDATE/index.wasm" public/game/push-up-arena/index.wasm
          cp "$CANDIDATE/BUILD_PROVENANCE.txt" /tmp/JOYSTICK_BUILD_PROVENANCE.txt

      - name: Write joystick runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const dir = 'public/game/push-up-arena';
          const info = name => {
            const data = fs.readFileSync(`${dir}/${name}`);
            return {bytes: data.length, sha256: crypto.createHash('sha256').update(data).digest('hex')};
          };
          const source = process.env.GODOT_SOURCE_SHA;
          const html = info('index.html'), js = info('index.js'), pck = info('index.pck'), wasm = info('index.wasm');
          const manifest = {
            protocolVersion: 1,
            buildId: `pocketpt-joystick-${source.slice(0,7)}-20260913`,
            godotVersion: '4.5.1',
            godotSourceCommit: source,
            godotBaseCommit: 'e863f91414ae786c7d773dd051ca71b16c1b26fe',
            mainScene: 'res://Main.tscn',
            pckBytes: pck.bytes,
            pckSha256: pck.sha256,
            htmlBytes: html.bytes,
            htmlSha256: html.sha256,
            jsBytes: js.bytes,
            jsSha256: js.sha256,
            wasmBytes: wasm.bytes,
            wasmSha256: wasm.sha256,
            localPackagedAcceptance: 'pass',
            authenticatedProductionVisualAcceptance: 'pending',
            controlAcceptance: {
              JoystickVector: 'pass',
              DiagonalVector: 'pass',
              ReleaseToStop: 'pass',
              WalkRunModePreserved: 'pass',
              ThrillerControlPreserved: 'pass',
              ProductionPhoneJoystick: 'pending'
            },
            note: 'One-thumb 360 joystick candidate. MOVE_VECTOR reuses the existing Godot movement owner; finger release sends STOP. Built on the current Walk/facing/Thriller source base. Production phone visual acceptance remains pending.'
          };
          fs.writeFileSync(`${dir}/pocketpt-world-build.json`, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          sha256sum public/game/push-up-arena/index.html public/game/push-up-arena/index.js public/game/push-up-arena/index.pck public/game/push-up-arena/index.wasm
          cat /tmp/JOYSTICK_BUILD_PROVENANCE.txt

      - name: Commit exact joystick runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game/push-up-arena/index.html public/game/push-up-arena/index.js public/game/push-up-arena/index.pck public/game/push-up-arena/index.wasm public/game/push-up-arena/pocketpt-world-build.json
          git diff --cached --check
          git commit -m "Stage 360 joystick Godot candidate [skip ci]"
          git push origin HEAD:feat/arena-joystick-20260913
