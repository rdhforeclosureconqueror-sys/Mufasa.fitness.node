name: Readiness evidence generator
on:
  pull_request:
    paths:
      - '.github/workflows/readiness-evidence.yml'
  workflow_dispatch:
    inputs:
      board:
        description: Existing readiness board
        required: true
        type: string
      card:
        description: Existing readiness card ID
        required: true
        type: string
      files:
        description: Comma-separated implementation paths
        required: true
        type: string
      pr:
        description: Pull request number
        required: true
        type: string
      test_run:
        description: Successful workflow run ID for the exact branch commit
        required: true
        type: string
      note:
        description: Verified machine evidence and outstanding acceptance
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical evidence
        env:
          BOARD: ${{ inputs.board || 'launch' }}
          CARD: ${{ inputs.card || 'launch-development-rugby-hq-web' }}
          FILES: ${{ inputs.files || 'public/rugby-player.html' }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          TEST_RUN: ${{ inputs.test_run }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          NOTE: ${{ inputs.note || 'Workflow smoke test only; no acceptance asserted.' }}
          READINESS_OPS_FILE: ${{ runner.temp }}/readiness-ops.json
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]]
          HEAD_SHA=$(git rev-parse HEAD)
          result=()
          if [[ -z "$TEST_RUN" && "$GITHUB_EVENT_NAME" == pull_request ]]; then
            for attempt in {1..30}; do
              TEST_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&status=success&per_page=100" | jq -r '[.workflow_runs[] | select(.name == "Rugby HQ acceptance tests" and .conclusion == "success")][0].id // empty')
              [[ -n "$TEST_RUN" ]] && break
              sleep 10
            done
            [[ -n "$TEST_RUN" ]]
            NOTE="Rugby HQ navigation automated acceptance; owner mobile navigation acceptance pending."
          fi
          if [[ -z "$TEST_RUN" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/45761701245" | jq -e '.head_sha == "41ef3da6c6a11a001c1d7676f9ec033f6615e569" and .status == "completed" and .conclusion == "success" and .name == "Rugby HQ acceptance tests"' >/dev/null
            echo "Verified historical test fixture; no current PASS asserted."
          fi
          if [[ -n "$TEST_RUN" ]]; then
            [[ "$TEST_RUN" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN" | jq -e --arg sha "$HEAD_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success" and .name == "Rugby HQ acceptance tests"' >/dev/null
            result=(--result PASS)
            NOTE="$NOTE; verified successful workflow run $TEST_RUN"
          fi
          npm run readiness:update -- --board "$BOARD" --card "$CARD" --action evidence --files "$FILES" --pr "$PR" --commit "$HEAD_SHA" --note "$NOTE" "${result[@]}"
          if [[ -n "$BASE" ]]; then npm run readiness:validate -- --base "$BASE"; else npm run readiness:validate; fi
          git diff --exit-code -- data/readiness/development-cards.json
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-readiness-evidence
          path: data/readiness/development-evidence.json
          if-no-files-found: error
