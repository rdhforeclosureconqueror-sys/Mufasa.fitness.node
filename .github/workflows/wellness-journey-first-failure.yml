name: Wellness Journey First-Failure Gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/community-hub.html'
      - 'public/eight-limbs-adinkra.*'
      - 'public/eight-limbs-yoga.*'
      - 'src/services/residentialWellnessService.js'
      - 'src/routes/residentialWellnessRoutes.js'
      - 'src/services/panAfricanMembershipService.js'
      - 'world-bridge-server.js'
      - 'test/pan-african-membership.test.js'
      - 'test/pac-protected-content-http.test.js'
      - 'src/config/pacProtectedAssets.js'
      - 'scripts/build-frontend.js'
      - 'public/pan-african-entry.*'
      - 'server.js'
      - 'test/pac-static-access-guard.test.js test/pan-african-membership.test.js'
      - 'public/eight-pillars-*'
      - 'public/admin-acceptance-*'
      - 'test/*journey*'
      - '.github/workflows/wellness-journey-first-failure.yml'
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: First-failure journey checks
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'code=$?; echo "::error title=FIRST FAILURE::Step: ${BASH_COMMAND} (exit ${code})"; echo "❌ First failure: \`${BASH_COMMAND}\` (exit ${code})" >> "$GITHUB_STEP_SUMMARY"; exit "$code"' ERR
          echo "## Wellness journey acceptance" >> "$GITHUB_STEP_SUMMARY"
          # The legacy repo-route-audit checks server.js static middleware and is not scoped to this journey change.
          # Keep that legacy finding visible separately; certify journey routes with scoped tests below.
          node --test test/eight-limbs-adinkra-community.test.js test/eight-limbs-yoga-journey.test.js test/pac-static-access-guard.test.js test/pan-african-membership.test.js test/pac-protected-content-http.test.js
          node --check public/eight-limbs-yoga.js
          node --check public/eight-limbs-adinkra.js
          node --check public/eight-pillars-story-review.js
          echo "✅ All scoped checks passed" >> "$GITHUB_STEP_SUMMARY"
