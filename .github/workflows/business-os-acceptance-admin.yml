name: Acceptance Lab admin API
on:
  pull_request:
    paths:
      - 'src/routes/businessOSAcceptanceRoutes.js'
      - 'world-bridge-server.js'
      - 'test/business-os-acceptance-admin-routes.test.js'
      - '.github/workflows/business-os-acceptance-admin.yml'
jobs:
  authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test test/business-os-acceptance-admin-routes.test.js test/business-os-acceptance-report.test.js test/business-os-acceptance-lab.test.js
