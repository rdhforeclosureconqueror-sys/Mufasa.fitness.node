name: Acceptance Lab dashboard entry
on:
  pull_request:
    paths:
      - 'public/dashboard.html'
      - 'public/dashboard.js'
      - 'test/business-os-acceptance-dashboard-link.test.js'
      - '.github/workflows/business-os-acceptance-dashboard.yml'
jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/business-os-acceptance-dashboard-link.test.js test/business-os-acceptance-ui.test.js
