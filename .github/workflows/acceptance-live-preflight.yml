name: Acceptance Lab live preflight
on:
  pull_request:
    paths:
      - 'src/routes/businessOSAcceptanceRoutes.js'
      - 'public/admin-acceptance-lab.html'
      - 'public/live-journey-preflight-runner.js'
      - 'test/live-journey-preflight-api.test.js'
      - '.github/workflows/acceptance-live-preflight.yml'
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/live-journey-safety-contract.test.js test/live-journey-preflight-api.test.js
