name: SALES-5 Gold certification
on:
  pull_request:
    paths:
      - 'src/business-os/sales/**'
      - 'test/ai-business-os-sales-*.test.js'
      - '.github/workflows/sales-5-gold.yml'
jobs:
  gold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/ai-business-os-sales-qualification.test.js test/ai-business-os-sales-offers.test.js test/ai-business-os-sales-governance.test.js test/ai-business-os-sales-gold-certification.test.js
