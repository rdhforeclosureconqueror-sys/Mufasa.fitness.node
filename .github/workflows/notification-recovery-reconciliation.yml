name: Notification recovery reconciliation
on:
  pull_request:
    paths:
      - 'src/business-os/organization/notification-recovery-reconciliation.js'
      - 'test/notification-recovery-reconciliation.test.js'
      - '.github/workflows/notification-recovery-reconciliation.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/notification-recovery-reconciliation.test.js test/notification-recovery-evidence.test.js test/notification-recovery-inspector.test.js
