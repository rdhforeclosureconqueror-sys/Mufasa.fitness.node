name: Rugby policy PostgreSQL integration
on:
  pull_request:
    paths:
      - 'src/rugby/**'
      - 'docs/rugby/master-intelligence-v1/beast-mode-policy-storage.sql'
      - 'test/rugby-beast-mode-postgres.integration.test.js'
      - '.github/workflows/rugby-policy-postgres.yml'
permissions:
  contents: read
jobs:
  postgres-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rugby_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: rugby_policy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rugby_test -d rugby_policy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/rugby-beast-mode-postgres.integration.test.js
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts pg@8
      - run: node --test test/rugby-beast-mode-postgres.integration.test.js
        env:
          RUGBY_REQUIRE_POSTGRES: '1'
          RUGBY_TEST_DATABASE_URL: postgres://rugby_test:local_ci_only@localhost:5432/rugby_policy_test
