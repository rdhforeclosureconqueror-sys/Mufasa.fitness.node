name: Marketing Bot canonical role evidence
on:
  pull_request:
    paths:
      - 'scripts/marketing-bot-canonical-role-evidence.js'
      - 'test/marketing-bot-canonical-role-evidence.test.js'
      - '.github/workflows/marketing-bot-canonical-role-evidence.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/marketing-bot-canonical-role-evidence.test.js
      - name: Execute canonical role Academies (blocked external gates expected)
        run: node scripts/marketing-bot-canonical-role-evidence.js || test "$?" -eq 1
