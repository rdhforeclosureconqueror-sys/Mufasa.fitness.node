name: Firebase member cloud preflight
on:
  pull_request:
    paths:
      - 'docs/architecture/storage.md'
      - 'docs/auth-rebuild-audit.md'
      - 'public/avatar-upload-contract.js'
      - 'scripts/firebase-member-cloud-preflight.js'
      - 'test/firebase-member-cloud-preflight.test.js'
      - 'test/firebase-cloud-acceptance-panel.test.js'
      - 'public/admin-acceptance-lab.html'
      - 'public/acceptance-progress.js'
      - 'public/firebase-cloud-acceptance.js'
      - '.github/workflows/firebase-member-cloud-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run one-touch design preflight
        run: node scripts/firebase-member-cloud-preflight.js
      - name: Run preflight regression tests
        run: node --test test/firebase-member-cloud-preflight.test.js test/firebase-cloud-acceptance-panel.test.js
