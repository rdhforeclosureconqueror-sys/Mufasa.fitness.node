name: Wellness guest claim verification
on:
  pull_request:
    paths:
      - 'src/services/eventCheckinStore.js'
      - 'world-bridge-server.js'
      - 'test/wellness-guest-claim.test.js'
      - '.github/workflows/wellness-guest-claim.yml'
  workflow_dispatch:
jobs:
  guest-claim:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/wellness-guest-claim.test.js test/event-checkin-store.test.js
