name: Rugby HQ acceptance tests
on:
  push:
    branches: [main]
    paths:
      - 'public/rugby-player.html'
      - 'public/rugby.html'
      - 'public/game/rugby-hq/**'
      - 'godot/rugby-hq-web/**'
      - 'scripts/*rugby-web*.js'
      - 'public/rugby-attack-intelligence.js'
      - 'src/rugby/**'
      - 'src/routes/rugbyProfileRoutes.js'
      - 'test/rugby-*.test.js'
      - '.github/workflows/rugby-hq-tests.yml'
  pull_request:
    paths:
      - 'public/rugby-player.html'
      - 'public/rugby.html'
      - 'public/game/rugby-hq/**'
      - 'godot/rugby-hq-web/**'
      - 'scripts/*rugby-web*.js'
      - 'public/rugby-attack-intelligence.js'
      - 'src/rugby/**'
      - 'src/routes/rugbyProfileRoutes.js'
      - 'test/rugby-*.test.js'
      - '.github/workflows/rugby-hq-tests.yml'
  workflow_dispatch:
jobs:
  rugby-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run rugby contract tests
        run: node --test test/rugby-godot-web.test.js test/rugby-attack-intelligence.test.js test/rugby-acceptance-contract.test.js test/rugby-assessment-validation.test.js test/rugby-checkin-validation.test.js test/rugby-inseason-plan.test.js test/rugby-profile-validation.test.js
      - name: Run assessment-to-program integration tests
        run: node --test test/rugby-priority-program-draft.test.js test/rugby-priority-program-preview.test.js test/rugby-priority-exercise-review.test.js
      - name: Smoke test live Rugby HQ assets
        run: node --test test/rugby-live-public-smoke.test.js
