name: Rugby HQ acceptance tests
on:
  push:
    branches: [main]
    paths:
      - 'src/rugby/**'
      - 'src/routes/rugbyProfileRoutes.js'
      - 'test/rugby-*.test.js'
      - '.github/workflows/rugby-hq-tests.yml'
  pull_request:
    paths:
      - 'src/rugby/**'
      - 'src/routes/rugbyProfileRoutes.js'
      - 'test/rugby-*.test.js'
      - '.github/workflows/rugby-hq-tests.yml'
  workflow_dispatch:
jobs:
  rugby-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run rugby tests
        run: node --test test/rugby-*.test.js
