name: Event Studio UI
on:
  pull_request:
    paths:
      - 'public/event-studio.html'
      - 'public/event-studio.js'
      - 'test/event-studio-reset.test.js'
      - 'test/community-event-attendance.test.js'
      - 'src/services/residentialCommunityService.js'
      - 'src/routes/residentialCommunityRoutes.js'
      - 'public/community-hub.html'
      - 'public/community-hub.js'
      - '.github/workflows/event-studio.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/event-studio.js
      - run: node --check public/community-hub.js
      - run: node --test test/event-studio-reset.test.js test/community-event-attendance.test.js
      - run: node --test test/community-event-catalog.test.js test/community-event-catalog-auth.test.js test/community-event-rsvp-integration.test.js
