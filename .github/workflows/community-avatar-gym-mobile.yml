name: Community Avatar and Virtual Gym Mobile Acceptance
on:
  pull_request:
    paths:
      - 'public/community-avatar.js'
      - 'public/community-avatar-diagnostics.js'
      - 'public/community-avatar-setup-mode.js'
      - 'public/community-gym-gateway.js'
      - 'public/community-entrance.html'
      - 'public/community-entrance.js'
      - 'public/push-up-release.html'
      - 'scripts/acceptance-community-avatar-gym-mobile.js'
      - '.github/workflows/community-avatar-gym-mobile.yml'
  workflow_dispatch:
jobs:
  mobile-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/acceptance-community-avatar-gym-mobile.js
