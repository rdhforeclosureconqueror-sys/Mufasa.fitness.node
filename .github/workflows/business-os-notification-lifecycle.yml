name: Business OS notification lifecycle
on:
  pull_request:
    paths:
      - 'src/business-os/organization/notification-lifecycle.js'
      - 'test/ai-business-os-notification-lifecycle.test.js'
      - '.github/workflows/business-os-notification-lifecycle.yml'
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/ai-business-os-notification-lifecycle.test.js test/ai-business-os-notification-outbox.test.js test/ai-business-os-blocker-diagnostics.test.js
