name: Rugby policy dashboard tests
on:
  pull_request:
    paths:
      - 'src/routes/rugbyPolicyPreviewRoutes.js'
      - 'test/rugby-policy-preview-routes.test.js'
      - 'test/rugby-policy-dashboard-diagnostics.test.js'
      - 'test/rugby-beast-mode-trusted-evidence.test.js'
      - 'src/rugby/beastModePolicy*.js'
      - 'src/rugby/beastModeTrustedEvidence.js'
      - '.github/workflows/rugby-policy-dashboard-tests.yml'
      - 'public/rugby-policy-dashboard*'
      - 'src/rugby/athleteReviewService.js'
      - 'src/routes/rugbyAthleteReviewRoutes.js'
      - 'test/rugby-athlete-review.test.js'
      - 'test/rugby-athlete-review-ui.test.js'
      - 'public/rugby-athlete-review*'
      - 'world-bridge-server.js'
      - 'src/rugby/assessmentCapture.js'
      - 'src/routes/rugbyAssessmentCaptureRoutes.js'
      - 'public/rugby-assessments*'
      - 'test/rugby-assessment-capture*.test.js'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/rugby-policy-preview-routes.test.js test/rugby-beast-mode-owner-policy.test.js test/rugby-policy-dashboard-diagnostics.test.js test/rugby-beast-mode-trusted-evidence.test.js
      - run: npm run readiness:validate
      - run: node --test test/rugby-athlete-review.test.js test/rugby-athlete-review-ui.test.js
      - run: node --test test/rugby-assessment-capture*.test.js
