name: Apply Thriller Mobile View Fix

on:
  push:
    branches:
      - fix/walk-thriller-mobile-view-20260913
    paths:
      - .github/workflows/apply-thriller-mobile-view-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout web fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/walk-thriller-mobile-view-20260913

      - name: Patch phone flow UI and diagnostics layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          flow = Path('public/arena-phone-flow.js')
          text = flow.read_text()
          anchor = '''    function setLocomotionMode(mode) {\n      if (!LOCOMOTION_MODES.has(mode) || !snapshot().canMove) return false;\n      if (movementMode === mode) return true;\n      if (control('SET_LOCOMOTION_MODE', {mode}) === null) return false;\n      movementMode = mode;\n      onChange(snapshot());\n      return true;\n    }\n'''
          addition = anchor + '''    function playAction(name) {\n      if (name !== 'ThrillerPart1' || !snapshot().canMove) return false;\n      release();\n      return control('PLAY_ACTION', {name}) !== null;\n    }\n'''
          if 'function playAction(name)' not in text:
              if anchor not in text: raise SystemExit('FIRST FAILURE: phone flow action insertion point missing')
              text = text.replace(anchor, addition, 1)
          old = 'return {snapshot, connect, accept, hold, nudge, release, setLocomotionMode, approach, cancelApproach, setup,'
          new = 'return {snapshot, connect, accept, hold, nudge, release, setLocomotionMode, playAction, approach, cancelApproach, setup,'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('FIRST FAILURE: phone flow export insertion point missing')
          flow.write_text(text)

          ui = Path('public/arena-phone-ui.js')
          text = ui.read_text()
          anchor = "      $('arenaLocomotionModeStatus').textContent = state.movementMode === 'RUN' ? 'Run mode' : 'Walk mode';\n"
          addition = anchor + "      $('arenaThrillerAction').hidden = !state.canMove;\n      $('arenaThrillerAction').disabled = !state.canMove;\n"
          if "$('arenaThrillerAction').hidden" not in text:
              if anchor not in text: raise SystemExit('FIRST FAILURE: Thriller render insertion point missing')
              text = text.replace(anchor, addition, 1)
          anchor = "    $('arenaRunMode').addEventListener('click', () => flow.setLocomotionMode('RUN'));\n"
          addition = anchor + "    $('arenaThrillerAction').addEventListener('click', () => {releasePointer(); flow.playAction('ThrillerPart1');});\n"
          if "flow.playAction('ThrillerPart1')" not in text:
              if anchor not in text: raise SystemExit('FIRST FAILURE: Thriller listener insertion point missing')
              text = text.replace(anchor, addition, 1)
          ui.write_text(text)

          html = Path('public/arena-push-up.html')
          text = html.read_text()
          old = '    #bridgeDebugToggle{position:static;align-self:flex-end;margin:8px 14px}\n'
          new = '    #bridgeDebugToggle{position:fixed;right:8px;bottom:max(40px,calc(8px + env(safe-area-inset-bottom)));margin:0;padding:8px 10px;font-size:11px;opacity:.88}\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'position:static;align-self:flex-end' in text:
              raise SystemExit('FIRST FAILURE: debug toggle layout still static')
          anchor = '    .locomotion-mode span{grid-column:1/-1;color:#aebbd0;font-size:12px;text-align:center}\n'
          addition = anchor + '    .locomotion-mode .thriller-action{grid-column:1/-1;background:#3a2456;border-color:#8d6bb5;color:#fff}\n'
          if '.thriller-action' not in text:
              if anchor not in text: raise SystemExit('FIRST FAILURE: Thriller style insertion point missing')
              text = text.replace(anchor, addition, 1)
          anchor = '        <button id="arenaRunMode" type="button" aria-pressed="false" data-selected="false">Run</button>\n'
          addition = anchor + '        <button id="arenaThrillerAction" class="thriller-action" type="button" hidden>Thriller</button>\n'
          if 'id="arenaThrillerAction"' not in text:
              if anchor not in text: raise SystemExit('FIRST FAILURE: Thriller markup insertion point missing')
              text = text.replace(anchor, addition, 1)
          text = text.replace('/arena-phone-flow.js?v=20260913-walk-run-v1', '/arena-phone-flow.js?v=20260913-walk-facing-thriller-v2')
          text = text.replace('/arena-phone-ui.js?v=20260913-walk-run-v1', '/arena-phone-ui.js?v=20260913-walk-facing-thriller-v2')
          html.write_text(text)

          test_file = Path('test/arena-locomotion-mode.test.js')
          text = test_file.read_text()
          if "Thriller action is explicit" not in text:
              text += '''\n\ntest('Thriller action is explicit, stops movement first, and is unavailable while locked', () => {\n  const f = fixture();\n  assert.equal(f.flow.playAction('ThrillerPart1'), true);\n  assert.equal(f.sent.at(-2).action, 'STOP');\n  assert.equal(f.sent.at(-1).action, 'PLAY_ACTION');\n  assert.equal(f.sent.at(-1).name, 'ThrillerPart1');\n  assert.equal(f.sent.at(-1).context, 'GYM_NAVIGATION');\n  assert.equal(f.flow.approach(), true);\n  const count = f.sent.length;\n  assert.equal(f.flow.playAction('ThrillerPart1'), false);\n  assert.equal(f.sent.length, count);\n});\n\ntest('mobile arena keeps diagnostics floating and exposes Thriller without consuming gym height', () => {\n  const html = fs.readFileSync(path.join(__dirname, '../public/arena-push-up.html'), 'utf8');\n  const ui = fs.readFileSync(path.join(__dirname, '../public/arena-phone-ui.js'), 'utf8');\n  assert.match(html, /id="arenaThrillerAction"/);\n  assert.match(ui, /playAction\\('ThrillerPart1'\\)/);\n  assert.doesNotMatch(html, /#bridgeDebugToggle\\{position:static/);\n  assert.match(html, /#bridgeDebugToggle\\{position:fixed/);\n});\n'''
          test_file.write_text(text)
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run focused arena control tests
        run: |
          node --test test/arena-locomotion-mode.test.js test/arena-phone-flow.test.js test/arena-phone-ui.test.js

      - name: Commit phone-first UI fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/arena-phone-flow.js public/arena-phone-ui.js public/arena-push-up.html test/arena-locomotion-mode.test.js
          git diff --cached --stat
          git commit -m "Add Thriller control and restore full mobile gym view"
          git push origin HEAD:fix/walk-thriller-mobile-view-20260913
