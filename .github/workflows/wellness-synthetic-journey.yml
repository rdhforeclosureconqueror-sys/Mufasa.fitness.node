name: Wellness synthetic journey acceptance
on:
  pull_request:
    paths:
      - 'scripts/wellness-synthetic-journey.js'
      - 'src/routes/businessOSAcceptanceRoutes.js'
      - 'public/admin-acceptance-lab.html'
      - 'public/wellness-synthetic-admin-runner.js'
      - 'test/wellness-admin-synthetic-integration.test.js'
      - 'test/wellness-phase4-http-auth.test.js'
      - 'src/services/communityEventCatalog.js'
      - 'src/services/residentialCommunityService.js'
      - 'src/services/eventCheckinStore.js'
      - '.github/workflows/wellness-synthetic-journey.yml'
  workflow_dispatch:
jobs:
  isolated-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/wellness-synthetic-journey.js
      - run: node --check public/wellness-synthetic-admin-runner.js
      - run: node scripts/wellness-synthetic-journey.js
      - run: node --test test/wellness-admin-synthetic-integration.test.js test/wellness-phase4-http-auth.test.js
      - run: node --test test/community-event-rsvp-integration.test.js test/community-event-attendance.test.js test/community-event-guest-link.test.js test/event-checkin-store.test.js
