name: Business OS acceptance lab
on:
  pull_request:
    paths:
      - 'scripts/business-os-acceptance-lab.js'
      - 'test/business-os-acceptance-lab.test.js'
      - 'src/business-os/sales/**'
      - '.github/workflows/business-os-acceptance-lab.yml'
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/business-os-acceptance-lab.test.js
      - run: node scripts/business-os-acceptance-lab.js
