name: Simba notification runtime isolation
on:
  pull_request:
    paths:
      - 'src/business-os/organization/simba-notification-runtime.js'
      - 'test/simba-notification-runtime.test.js'
      - 'docs/simba-notification-runtime-isolation.md'
      - '.github/workflows/simba-notification-runtime.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/simba-notification-runtime.test.js test/simba-notification-schema-migration.test.js
