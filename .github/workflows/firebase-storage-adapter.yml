name: Firebase storage adapter synthetic security
on:
  pull_request:
    paths:
      - 'lib/firebase-member-cloud-storage.js'
      - 'test/firebase-member-cloud-storage.test.js'
      - '.github/workflows/firebase-storage-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test synthetic storage adapter and member isolation
        run: node --test test/firebase-member-cloud-storage.test.js
