name: Stage LIVE_MOCAP Godot Runtime

on:
  push:
    branches:
      - stage/live-mocap-runtime-20260914
    paths:
      - .github/workflows/stage-live-mocap-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-live-mocap-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_BRANCH: stage/live-mocap-runtime-20260914
      GODOT_SOURCE_COMMIT: c0ac646945c70b3bbb83c8a5481f29db51ff3dd4
      GODOT_CANDIDATE_COMMIT: 0ef75520ec493851158f80e8c44195085622ef16
      GODOT_GENERATED_BRANCH: generated/web-candidate
    steps:
      - name: Checkout Web branch
        uses: actions/checkout@v4
        with:
          ref: stage/live-mocap-runtime-20260914

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Protect Arena control and live-motion regressions
        run: |
          node --test test/arena-live-motion-adapter.test.js test/arena-phone-flow.test.js test/arena-phone-ui.test.js test/arena-diagnostics.test.js

      - name: Fetch exact generated Godot candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mufasagodot-candidate
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "${GODOT_GENERATED_BRANCH}" \
            https://github.com/rdhforeclosureconqueror-sys/mufasagodot.git \
            /tmp/mufasagodot-candidate
          ACTUAL_CANDIDATE_COMMIT="$(git -C /tmp/mufasagodot-candidate rev-parse HEAD)"
          test "$ACTUAL_CANDIDATE_COMMIT" = "$GODOT_CANDIDATE_COMMIT"
          git -C /tmp/mufasagodot-candidate sparse-checkout set build/ci-web
          CANDIDATE=/tmp/mufasagodot-candidate/build/ci-web
          for file in index.html index.js index.pck index.wasm BUILD_PROVENANCE.txt; do
            test -s "$CANDIDATE/$file"
          done
          grep -Fx "godot_source_commit=${GODOT_SOURCE_COMMIT}" "$CANDIDATE/BUILD_PROVENANCE.txt"

      - name: Verify producer hashes and stage exact bytes
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=/tmp/mufasagodot-candidate/build/ci-web
          PROVENANCE="$CANDIDATE/BUILD_PROVENANCE.txt"
          for file in index.html index.js index.pck index.wasm; do
            EXPECTED="$(awk -v wanted="build/ci-web/${file}" '$2 == wanted {print $1}' "$PROVENANCE")"
            test -n "$EXPECTED"
            ACTUAL="$(sha256sum "$CANDIDATE/$file" | awk '{print $1}')"
            test "$ACTUAL" = "$EXPECTED"
          done
          mkdir -p public/game/push-up-arena
          cp "$CANDIDATE/index.html" public/game/push-up-arena/index.html
          cp "$CANDIDATE/index.js" public/game/push-up-arena/index.js
          cp "$CANDIDATE/index.pck" public/game/push-up-arena/index.pck
          cp "$CANDIDATE/index.wasm" public/game/push-up-arena/index.wasm

      - name: Write exact LIVE_MOCAP build manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          const root = 'public/game/push-up-arena';
          const meta = name => {
            const data = fs.readFileSync(path.join(root, name));
            return {bytes: data.length, sha256: crypto.createHash('sha256').update(data).digest('hex')};
          };
          const html = meta('index.html');
          const js = meta('index.js');
          const pck = meta('index.pck');
          const wasm = meta('index.wasm');
          const source = process.env.GODOT_SOURCE_COMMIT;
          const candidate = process.env.GODOT_CANDIDATE_COMMIT;
          const manifest = {
            protocolVersion: 1,
            buildId: `pocketpt-live-mocap-${source.slice(0,7)}-20260914`,
            godotVersion: '4.5.1',
            godotSourceCommit: source,
            godotCandidateCommit: candidate,
            producerHashVerification: 'pass',
            mainScene: 'res://Main.tscn',
            pckBytes: pck.bytes, pckSha256: pck.sha256,
            htmlBytes: html.bytes, htmlSha256: html.sha256,
            jsBytes: js.bytes, jsSha256: js.sha256,
            wasmBytes: wasm.bytes, wasmSha256: wasm.sha256,
            liveMocap: {
              sourceRegression: 'pass',
              packagedCandidate: 'pass',
              canonicalBoneMapping: 'pass',
              ownershipRegression: 'pass',
              stalePacketProtection: 'pass',
              multiplayerRegression: 'pass',
              restRetargetRegression: 'pass',
              physicalCameraAcceptance: 'pending',
              personalizedAvatarVisualAcceptance: 'pending',
              mobileCoachVoiceAcceptance: 'pending'
            },
            note: 'Exact hash-verified Godot 4.5.1 candidate for merged LIVE_MOCAP source. Automated source/protocol/export gates passed. Physical camera, coach audio, and personalized-avatar visual acceptance remain pending.'
          };
          fs.writeFileSync(path.join(root, 'pocketpt-world-build.json'), JSON.stringify(manifest, null, 2) + '\n');
          console.log(JSON.stringify(manifest, null, 2));
          NODE

      - name: Commit staged runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mufasagodot-candidate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game/push-up-arena/index.html public/game/push-up-arena/index.js public/game/push-up-arena/index.pck public/game/push-up-arena/index.wasm public/game/push-up-arena/pocketpt-world-build.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Exact candidate is already staged."
            exit 0
          fi
          git commit -m "Stage verified LIVE_MOCAP Godot runtime [skip ci]"
          git push origin HEAD:"${WEB_BRANCH}"
