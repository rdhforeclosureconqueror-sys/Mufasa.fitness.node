name: Stage Walk Facing Thriller Candidate

on:
  push:
    branches:
      - fix/walk-thriller-mobile-view-20260913
    paths:
      - .github/workflows/stage-walk-facing-thriller-candidate.yml

permissions:
  contents: write

jobs:
  test-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_SOURCE_COMMIT: c158afd9db8c995f04d355df8682be38e71306ab
      GODOT_GENERATED_BRANCH: generated/walk-facing-thriller-candidate
    steps:
      - name: Checkout web fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/walk-thriller-mobile-view-20260913

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused phone locomotion tests
        run: node --test test/arena-locomotion-mode.test.js test/arena-phone-flow.test.js test/arena-phone-ui.test.js

      - name: Wait for exact generated Godot candidate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if git ls-remote --exit-code https://github.com/rdhforeclosureconqueror-sys/mufasagodot.git "refs/heads/${GODOT_GENERATED_BRANCH}" >/dev/null 2>&1; then
              rm -rf /tmp/mufasa-probe
              git clone --depth 1 --filter=blob:none --sparse --branch "${GODOT_GENERATED_BRANCH}" https://github.com/rdhforeclosureconqueror-sys/mufasagodot.git /tmp/mufasa-probe >/dev/null 2>&1
              git -C /tmp/mufasa-probe sparse-checkout set build/ci-web
              if grep -Fx "godot_source_commit=${GODOT_SOURCE_COMMIT}" /tmp/mufasa-probe/build/ci-web/BUILD_PROVENANCE.txt >/dev/null 2>&1; then
                echo "Exact Godot candidate is available."
                exit 0
              fi
            fi
            echo "Waiting for exact Godot candidate (${attempt}/60)..."
            sleep 15
          done
          echo "FIRST FAILURE: exact Godot candidate did not appear in time." >&2
          exit 1

      - name: Fetch exact Godot Web candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mufasagodot-candidate
          git clone --depth 1 --filter=blob:none --sparse --branch "${GODOT_GENERATED_BRANCH}" https://github.com/rdhforeclosureconqueror-sys/mufasagodot.git /tmp/mufasagodot-candidate
          git -C /tmp/mufasagodot-candidate sparse-checkout set build/ci-web
          CANDIDATE=/tmp/mufasagodot-candidate/build/ci-web
          for file in index.html index.js index.pck index.wasm BUILD_PROVENANCE.txt; do test -s "$CANDIDATE/$file"; done
          grep -Fx "godot_source_commit=${GODOT_SOURCE_COMMIT}" "$CANDIDATE/BUILD_PROVENANCE.txt"
          grep -Fx "walk_source=res://assets/animations/player/rashad_walk_corrected.glb" "$CANDIDATE/BUILD_PROVENANCE.txt"
          grep -Fx "thriller_source=res://assets/animations/player/rashad_thriller_part1_target_native.glb" "$CANDIDATE/BUILD_PROVENANCE.txt"
          cp "$CANDIDATE/index.html" public/game/push-up-arena/index.html
          cp "$CANDIDATE/index.js" public/game/push-up-arena/index.js
          cp "$CANDIDATE/index.pck" public/game/push-up-arena/index.pck
          cp "$CANDIDATE/index.wasm" public/game/push-up-arena/index.wasm

      - name: Write exact runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          cd public/game/push-up-arena
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const source = process.env.GODOT_SOURCE_COMMIT;
          const info = name => { const data = fs.readFileSync(name); return {bytes:data.length,sha256:crypto.createHash('sha256').update(data).digest('hex')}; };
          const html=info('index.html'), js=info('index.js'), pck=info('index.pck'), wasm=info('index.wasm');
          const manifest={
            protocolVersion:1,
            buildId:`pocketpt-walk-facing-thriller-${source.slice(0,7)}-20260913`,
            godotVersion:'4.5.1',
            godotSourceCommit:source,
            mainScene:'res://Main.tscn',
            pckBytes:pck.bytes,pckSha256:pck.sha256,
            htmlBytes:html.bytes,htmlSha256:html.sha256,
            jsBytes:js.bytes,jsSha256:js.sha256,
            wasmBytes:wasm.bytes,wasmSha256:wasm.sha256,
            localPackagedAcceptance:'pass',
            authenticatedProductionVisualAcceptance:'pending',
            sourceValidation:{Walk:'pass',Run:'pass',ThrillerPart1:'pass',MovementFacing:'pass'},
            note:'Cloud-exported from the exact Godot fix commit. Corrected Walk has validated animated tracks; Thriller source/action validated; facing code validated. Production phone visual acceptance remains pending.'
          };
          fs.writeFileSync('pocketpt-world-build.json',JSON.stringify(manifest,null,2)+'\n');
          console.log(manifest);
          NODE
          sha256sum index.html index.js index.pck index.wasm pocketpt-world-build.json

      - name: Commit candidate to web fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game/push-up-arena/index.html public/game/push-up-arena/index.js public/game/push-up-arena/index.pck public/game/push-up-arena/index.wasm public/game/push-up-arena/pocketpt-world-build.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No runtime artifact changes to commit."
            exit 0
          fi
          git commit -m "Stage fixed Walk facing Thriller Godot candidate"
          git push origin HEAD:fix/walk-thriller-mobile-view-20260913
