name: Marketing Bot governed cycle smoke
on:
  pull_request:
    paths:
      - 'test/marketing-bot-governed-cycle-smoke.test.js'
      - '.github/workflows/marketing-bot-governed-cycle-smoke.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/marketing-bot-governed-cycle-smoke.test.js
