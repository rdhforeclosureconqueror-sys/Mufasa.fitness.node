services:
  - type: web
    name: mufasafitsite
    runtime: static
    buildCommand: npm ci && npm run build:frontend
    staticPublishPath: ./dist
    envVars:
      - key: VITE_GOOGLE_MAPS_BROWSER_API_KEY
        sync: false
  - type: web
    name: mufasa-fitness-node
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_PUBLIC_URL
        value: https://mufasafitsite.onrender.com
      - key: BACKEND_PUBLIC_URL
        value: https://mufasa-fitness-node.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://mufasafitsite.onrender.com
      - key: ENABLE_AVATAR_FEATURE
        value: "true"
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: POCKET_PT_DATA_DIR
        value: /var/data
    disk:
      name: pocket-pt-data
      mountPath: /var/data
      sizeGB: 1
