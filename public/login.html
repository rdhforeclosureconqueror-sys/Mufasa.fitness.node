<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign In · Pocket PT</title><link rel="stylesheet" href="/global-nav.css"><style>body{margin:0;min-height:100vh;background:#07110c;color:#f7fff9;font:16px system-ui}.auth{width:min(440px,calc(100% - 32px));margin:8vh auto;padding:24px;border:1px solid #31543b;border-radius:18px;background:#0d1a12}.auth h1{margin-top:0}.auth label{display:grid;gap:7px;margin:16px 0}.auth input:not([type=checkbox]){min-height:48px;padding:10px;border:1px solid #6c9977;border-radius:10px;background:#07110c;color:#fff;font:inherit}.remember{display:flex!important;grid-template-columns:none!important;align-items:center;gap:10px!important}.remember input{width:22px;height:22px}.auth button{width:100%;min-height:48px;border:0;border-radius:10px;background:#e2bc58;color:#111;font:inherit;font-weight:900}.auth a{color:#bde9c7}.status{min-height:1.5em;color:#ffd0d0}</style><script src="/auth-state-runtime.js"></script><script src="/global-nav.js" defer></script></head><body><main class="auth"><h1 id="title">Sign In</h1><p>Use your account credentials. Persistent sign-in is optional and off by default.</p><form id="form"><label id="nameRow" hidden>Name<input id="name" autocomplete="name" maxlength="120"></label><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><label class="remember" id="rememberRow"><input id="remember" type="checkbox"> Remember me on this device</label><button id="submit">Sign In</button></form><p class="status" id="status" role="status" aria-live="polite"></p><p><a href="#" id="mode">Create Account</a></p></main><script src="/login.js"></script></body></html>
