<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img"><title>Connected defenders number threats and adjust together to a changing picture.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#e6c783"/></marker></defs><rect width="640" height="340" rx="22" fill="#152b20"/><g fill="#f6f3e8" font-family="system-ui,sans-serif"><circle cx="140" cy="160" r="23" fill="#76cfa2"/><text x="132" y="168" font-size="23" fill="#102019">A</text><circle cx="440" cy="160" r="23" fill="#e6c783"/><text x="432" y="168" font-size="23" fill="#102019">D</text><path d="M170 145 L340 85" stroke="#e6c783" stroke-width="4" fill="none" marker-end="url(#arrow)" /><path d="M170 180 L340 245" stroke="#e6c783" stroke-width="4" fill="none" marker-end="url(#arrow)" stroke-dasharray="9 7"/><text x="55" y="55" font-size="26">Read the changing picture</text><text x="75" y="300" font-size="22">A: attacker</text><text x="350" y="300" font-size="22">D: defender</text><circle cx="440" cy="245" r="23" fill="#e6c783"/><text x="432" y="253" font-size="23" fill="#102019">D</text><path d="M440 185 L440 220" stroke="#90b49e" stroke-width="4" fill="none" /></g></svg>
