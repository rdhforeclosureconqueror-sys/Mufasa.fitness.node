<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img"><title>Traditional 505: 10 m untimed run-in, then 5 m timed out to a 180° turn and 5 m back through the timing gate.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#e6c783"/></marker></defs><rect width="640" height="340" rx="22" fill="#152b20"/><g fill="#f6f3e8" font-family="system-ui,sans-serif"><text x="35" y="48" font-size="24">10 m run-in</text><text x="355" y="48" font-size="24">5 m out + 5 m back</text><path d="M45 85 L45 230" stroke="#90b49e" stroke-width="4" fill="none" /><text x="25" y="270" font-size="22">Start</text><path d="M365 85 L365 230" stroke="#90b49e" stroke-width="4" fill="none" /><text x="345" y="270" font-size="22">Gate</text><path d="M525 85 L525 230" stroke="#90b49e" stroke-width="4" fill="none" /><text x="505" y="270" font-size="22">Turn</text><path d="M62 125 L340 125" stroke="#e6c783" stroke-width="4" fill="none" marker-end="url(#arrow)" stroke-dasharray="9 7"/><path d="M385 125 L500 125" stroke="#e6c783" stroke-width="4" fill="none" marker-end="url(#arrow)" /><path d="M500 190 L385 190" stroke="#e6c783" stroke-width="4" fill="none" marker-end="url(#arrow)" /><text x="392" y="315" font-size="22">180° turn</text></g></svg>
