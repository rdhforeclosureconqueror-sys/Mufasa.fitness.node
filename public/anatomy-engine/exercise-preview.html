<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise anatomy candidate</title><style>body{background:#101817;color:#eee;font:16px system-ui;max-width:900px;margin:auto;padding:16px}h1{color:#d4af37}input,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin:6px 0}details{border:1px solid #52625b;border-radius:8px;padding:12px;margin:8px 0}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere}iframe{width:100%;height:780px;border:0}</style><h1>Exercise Intelligence</h1><p id="status" role="status">Loading canonical catalog…</p><section id="selector" hidden><label>Search exercises<input type="search"></label><label>Exercise<select></select></label><div data-cards aria-live="polite"></div><details><summary>Developer diagnostics</summary><pre></pre></details></section><label><input id="experimental" type="checkbox" style="width:auto"> Show experimental muscle hypotheses (not anatomically approved)</label><p id="preview-status" role="status">Neutral viewer. Experimental mode is off.</p><iframe id="viewer" title="Anatomy viewer" src="./premium-preview.html?mode=exercise"></iframe><script type="module">import {getActivation} from './activation-registry.mjs';import {attachExerciseSelector} from './exercise-selector.mjs';try{const response=await fetch('./exercise-index.json');if(!response.ok)throw Error('Catalog unavailable');const data=await response.json();if(!Array.isArray(data.rows))throw Error('Invalid catalog');document.querySelector('#status').textContent=data.rows.length+' canonical exercises';const root=document.querySelector('#selector');let selected='';const toggle=document.querySelector('#experimental');function sync(){const active=toggle.checked&&getActivation(selected).candidates.length>0;const q=new URLSearchParams({mode:'exercise'});if(active){q.set('experimental','1');q.set('exercise',selected);}document.querySelector('#viewer').src='./premium-preview.html?'+q;document.querySelector('#preview-status').textContent=active?'Experimental hypotheses only — not approved.':toggle.checked?'No provisional mapping for this exercise; neutral viewer.':'Neutral viewer. Experimental mode is off.';}toggle.addEventListener('change',sync);attachExerciseSelector(root,data.rows,id=>{selected=id;sync();});root.hidden=false;}catch(e){document.querySelector('#status').textContent=e.message;}</script></html>
