<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercise anatomy candidate</title><style>body{background:#101817;color:#eee;font:16px system-ui;max-width:900px;margin:auto;padding:16px}h1{color:#d4af37}input,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin:6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}iframe{width:100%;height:780px;border:0}</style><h1>Exercise Intelligence</h1><p id="status" role="status">Loading canonical catalog…</p><section id="selector" hidden><label>Search exercises<input type="search"></label><label>Exercise<select></select></label><pre aria-live="polite"></pre></section><p>Candidate relationships only. The anatomy below remains an independent demonstration, not exercise-specific activation.</p><iframe title="Independent anatomy demonstration" src="./premium-preview.html"></iframe><script type="module">import {attachExerciseSelector} from './exercise-selector.mjs';try{const response=await fetch('./exercise-index.json');if(!response.ok)throw Error('Catalog unavailable');const data=await response.json();if(!Array.isArray(data.rows))throw Error('Invalid catalog');document.querySelector('#status').textContent=data.rows.length+' canonical exercises';const root=document.querySelector('#selector');attachExerciseSelector(root,data.rows);root.hidden=false;}catch(e){document.querySelector('#status').textContent=e.message;}</script></html>
