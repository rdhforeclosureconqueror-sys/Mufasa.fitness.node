<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anatomy candidate preview</title><style>body{background:#101817;color:#eee;font:16px system-ui;max-width:850px;margin:auto;padding:16px}h1{color:#d4af37}select{font:inherit;padding:12px;background:#24312d;color:white}section{padding:12px;background:#192522;border-radius:12px;margin:12px 0}#models{display:grid;grid-template-columns:1fr 1fr;gap:8px}svg{width:100%;height:auto;max-height:540px}figure{margin:0;text-align:center}#models[data-view=anterior] figure:nth-child(2),#models[data-view=posterior] figure:nth-child(1){display:none}#models:not([data-view=both]){grid-template-columns:1fr}#models:not([data-view=both]) svg{max-height:680px} [data-region-id]:focus:not(:focus-visible){outline:none} [data-selected=true]{stroke:#fff;stroke-width:3}[data-region-id]:focus-visible{stroke:white;stroke-width:3;outline:2px solid white;outline-offset:2px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Milele Fit Anatomy — candidate preview</h1><p>Unvalidated vector artwork and illustrative mappings. Not the premium visual master or exercise advice.</p><label>Sample <select id="sample"><option value="push">Push</option><option value="pull">Pull</option><option value="legs">Legs</option><option value="missing">Missing</option></select></label><label>View <select id="view"><option value="both">Both</option><option value="anterior">Front — enlarged</option><option value="posterior">Back — enlarged</option></select></label><section id="models" data-view="both"></section><section id="selection" aria-live="polite">Select a muscle</section><p>Gold: primary · Emerald: secondary · Blue: stabilizer · Gray: unknown</p><section><h2>Diagnostics</h2><pre id="diagnostics" aria-live="polite">Loading</pre></section><a href="./lab.html" style="color:#d4af37">Original fixture lab</a><script type="module">
import {resolveRegions,paintRegions} from './engine.mjs';
const $=id=>document.getElementById(id);
const m=(muscleId,role)=>({muscleId,role,side:'bilateral'});
const samples={push:[m('pectoralis_major','primary'),m('triceps_brachii','secondary'),m('anterior_deltoid','secondary'),m('rectus_abdominis','stabilizer')],pull:[m('latissimus_dorsi','primary'),m('biceps_brachii','secondary')],legs:[m('rectus_femoris','primary'),m('gluteus_maximus','primary'),m('gastrocnemius','secondary')],missing:[]};
let models=[],cleanup=[];const readable=id=>id.split('_').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');$('view').addEventListener('change',()=>{$('models').dataset.view=$('view').value;document.querySelectorAll('[data-selected]').forEach(n=>n.removeAttribute('data-selected'));$('selection').textContent='Select a muscle';});
try {
for(const view of ['anterior','posterior']){
const response=await fetch('./assets/'+view+'-candidate.svg');if(!response.ok)throw Error('Asset unavailable: '+view);
const doc=new DOMParser().parseFromString(await response.text(),'image/svg+xml');if(doc.documentElement.localName!=='svg'||doc.querySelector('parsererror'))throw Error('Invalid SVG');
const svg=document.importNode(doc.documentElement,true);
const regions=[...svg.querySelectorAll('[data-region-id]')].map(n=>({id:n.getAttribute('data-region-id'),muscleId:n.getAttribute('data-muscle-id'),side:n.getAttribute('data-side')}));
const figure=document.createElement('figure'),caption=document.createElement('figcaption');caption.textContent=view;figure.append(svg,caption);$('models').append(figure);models.push({svg,regions});
}
function render(){cleanup.forEach(fn=>fn());cleanup=[];document.querySelectorAll('[data-selected]').forEach(n=>n.removeAttribute('data-selected'));$('selection').textContent='Select a muscle';const key=$('sample').value;const result=resolveRegions(models.flatMap(m=>m.regions),samples[key],key==='missing'?'missing':'unverified');for(const model of models){const ids=new Set(model.regions.map(r=>r.id));cleanup.push(paintRegions(model.svg,{...result,regions:result.regions.filter(r=>ids.has(r.id))},r=>{document.querySelectorAll('[data-selected]').forEach(n=>n.removeAttribute('data-selected'));for(const node of model.svg.querySelectorAll('[data-region-id]'))if(node.getAttribute('data-region-id')===r.id)node.setAttribute('data-selected','true');$('selection').textContent=readable(r.muscleId)+' — '+r.side+' / '+r.role+' (unverified)';}));}$('diagnostics').textContent=JSON.stringify({status:result.status,issues:result.issues,regionCount:result.regions.length},null,2);}
$('sample').addEventListener('change',render);render();
}catch(e){$('diagnostics').textContent='Preview failed: '+e.message;}
</script></html>
