<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milele Fit Anatomy Lab</title><style>body{background:#101414;color:#eee;font:16px system-ui;margin:auto;padding:20px;max-width:760px}button,select{font:inherit;padding:12px;background:#242b2b;color:white;border:1px solid #777;border-radius:8px}svg{width:100%;max-height:350px}path,rect,ellipse{stroke:#151919;stroke-width:2} [tabindex]:focus{stroke:white;stroke-width:4}section{background:#1b2121;padding:16px;border-radius:12px;margin:16px 0}label{display:block;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>Milele Fit Anatomy Lab</h1><p>Engineering fixture only — not anatomical artwork or verified exercise advice.</p><label>Sample mapping <select id="sample"><option value="push">Push pattern</option><option value="pull">Pull pattern</option><option value="missing">Missing data</option><option value="invalid">Unknown muscle</option></select></label><label>Geometry <select id="geometry"><option value="rect">Fixture A</option><option value="ellipse">Fixture B</option></select></label><section><svg id="map" viewBox="0 0 320 220" aria-label="Synthetic anterior and posterior region test"></svg><p>Gold: primary · Emerald: secondary · Blue: stabilizer · Gray: other or unknown (see labels)</p><p id="selection" aria-live="polite">Select a region</p></section><section><h2>Mapping diagnostics</h2><pre id="diagnostics" aria-live="polite"></pre></section><script type="module">
import {resolveRegions,paintRegions} from './engine.mjs';
const $=id=>document.getElementById(id),svg=$('map'),ns='http://www.w3.org/2000/svg';
const regions=['chest','abdominals','triceps','lats'].flatMap(muscleId=>['left','right'].map(side=>({id:muscleId+'-'+side,muscleId,side})));
const m=(muscleId,role)=>({muscleId,role,side:'bilateral'});
const samples={push:[m('chest','primary'),m('triceps','secondary'),m('abdominals','stabilizer')],pull:[m('lats','primary')],missing:[],invalid:[m('not-in-fixture','primary')]};
let cleanup=()=>{};
function render(){cleanup();svg.replaceChildren();$('selection').textContent='Select a region';const shape=$('geometry').value;for(const [i,r] of regions.entries()){const col=i<4?0:1,x=col*160+25+(i%2)*60,y=35+Math.floor(i%4/2)*85;const node=document.createElementNS(ns,shape);const attrs=shape==='rect'?{x,y,width:50,height:60,rx:10}:{cx:x+25,cy:y+30,rx:25,ry:30};for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);node.setAttribute('data-region-id',r.id);svg.append(node);const label=document.createElementNS(ns,'text');label.setAttribute('x',x+25);label.setAttribute('y',y+74);label.setAttribute('text-anchor','middle');label.setAttribute('font-size','9');label.setAttribute('fill','white');label.textContent=r.muscleId+' '+r.side[0];svg.append(label);}const key=$('sample').value;const result=resolveRegions(regions,samples[key],key==='missing'?'missing':'unverified');cleanup=paintRegions(svg,result,r=>$('selection').textContent=r.muscleId+' / '+r.side+' / '+r.role+' (fixture)');$('diagnostics').textContent=JSON.stringify({status:result.status,issues:result.issues,regions:result.regions.map(({id,role})=>({id,role}))},null,2);}
$('sample').addEventListener('change',render);$('geometry').addEventListener('change',render);render();
</script></html>
