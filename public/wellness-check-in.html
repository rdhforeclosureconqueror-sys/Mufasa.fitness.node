<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milele Fit Check-In</title><style>body{background:#101813;color:#f5f1e8;font:16px system-ui;padding:25px}main{max-width:450px;margin:8vh auto}h1{color:#e8c987}label{display:block;margin:15px 0}input,textarea,button{display:block;box-sizing:border-box;width:100%;padding:14px;font:inherit;margin-top:6px;border-radius:10px}button{background:#e8c987}a{color:#e8c987}</style></head><body><main><h1>Event Check-In</h1><p>Optional guest check-in for Milele Fit events.</p><p id="status">Checking availability…</p><form id="before" hidden><label>Name<input name="name" required maxlength="100"></label><label>Email<input name="email" type="email" required maxlength="254"></label><label>How do you feel?<textarea name="before" maxlength="500"></textarea></label><button>Check In</button></form><form id="after" hidden><label>How do you feel after the session?<textarea name="after" required maxlength="1000"></textarea></label><button>Submit Reflection</button></form><p><a href="/apartment-wellness.html">Explore Community Wellness</a></p></main><script src="/event-checkin.js" defer></script></body></html>
