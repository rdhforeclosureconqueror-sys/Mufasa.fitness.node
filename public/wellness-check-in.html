<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milele Fit Check-In</title><style>body{margin:0;min-height:100vh;min-height:100dvh;box-sizing:border-box;background:#101813 url('/waterfallsoundbowl.jpg') center 38%/cover fixed no-repeat;color:#f5f1e8;font:16px system-ui;position:relative;padding:24px}body::before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(8,19,14,.76),rgba(8,19,14,.42)),linear-gradient(0deg,rgba(8,19,14,.52),transparent 65%);pointer-events:none}main{position:relative;max-width:450px;margin:clamp(20px,8vh,100px) auto;padding:clamp(20px,4vw,32px);background:rgba(10,24,19,.86);border:1px solid rgba(232,201,135,.4);border-radius:18px;box-shadow:0 18px 55px rgba(0,0,0,.36);backdrop-filter:blur(8px)}h1{color:#e8c987}label{display:block;margin:15px 0}input,textarea,button{display:block;box-sizing:border-box;width:100%;padding:14px;font:inherit;margin-top:6px;border-radius:10px}input,textarea{background:#fff;color:#18231b;border:2px solid transparent}input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #e8c987;outline-offset:3px}button{background:#e8c987;color:#18231b;border:0;cursor:pointer;font-weight:700}a{color:#f5d995}@media(max-width:600px){body{background-attachment:scroll;background-position:58% center;padding:16px}main{margin:12vh auto 24px}}@media(prefers-reduced-transparency:reduce){main{backdrop-filter:none;background:#10251c}}</style></head><body><main><h1>Event Check-In</h1><p>Optional guest check-in for Milele Fit events.</p><p id="status">Checking availability…</p><form id="before" hidden><label>Name<input name="name" required maxlength="100"></label><label>Email<input name="email" type="email" required maxlength="254"></label><label>How do you feel?<textarea name="before" maxlength="500"></textarea></label><button>Check In</button></form><form id="after" hidden><label>How do you feel after the session?<textarea name="after" required maxlength="1000"></textarea></label><button>Submit Reflection</button></form><p><a href="/apartment-wellness.html">Explore Community Wellness</a></p></main><script src="/event-checkin.js" defer></script></body></html>
