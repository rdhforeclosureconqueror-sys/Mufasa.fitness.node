<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Reflection</title><style>body{font:16px system-ui;background:#101813;color:white;padding:24px;max-width:480px;margin:40px auto}h1{color:#e8c987}select,textarea,button{display:block;padding:14px;margin:14px 0;width:100%;box-sizing:border-box;font:inherit}button{background:#e8c987;border:0;border-radius:10px}</style><h1>After Your Session</h1><form id="f"><label>How do you feel now?<select name="feeling" required><option value="">Select</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Reflection (optional)<textarea name="notes" maxlength="600"></textarea></label><button>Save Reflection</button></form><p id="status" role="status"></p><a href="/apartment-wellness.html">Explore Wellness Community</a><script>const q=new URLSearchParams(location.search);document.getElementById("f").onsubmit=async e=>{e.preventDefault();const form=e.target;const data=Object.fromEntries(new FormData(form));data.token=q.get("token");try{const r=await fetch("/api/public/event-checkins/"+encodeURIComponent(q.get("id")||"")+"/reflection",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error);form.hidden=true;document.getElementById("status").textContent="Reflection saved. Thank you!"}catch(err){document.getElementById("status").textContent=err.message}}</script>
