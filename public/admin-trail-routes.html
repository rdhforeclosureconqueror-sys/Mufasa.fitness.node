<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trail route verification</title><link rel="stylesheet" href="greatness.css"></head><body><main><h1>Trail route verification</h1><p>Import only traceable route geometry whose license and attribution allow local storage and display.</p><form id="routeForm" class="card"><label>Google Place ID <input name="googlePlaceId" required></label><label>Canonical name <input name="canonicalName" list="initialTrails" required></label><datalist id="initialTrails"><option>Northaven Trail</option><option>Vitruvian Trail</option><option>Brookhaven College Jogging Trail</option></datalist><label>Aliases (comma separated) <input name="aliases"></label><label>Start latitude (optional override) <input name="startLatitude" inputmode="decimal"></label><label>Start longitude (optional override) <input name="startLongitude" inputmode="decimal"></label><label>End latitude (optional override) <input name="endLatitude" inputmode="decimal"></label><label>End longitude (optional override) <input name="endLongitude" inputmode="decimal"></label><label>Route type <select name="routeType"><option value="unknown">Detect loop or point-to-point</option><option value="loop">Loop</option><option value="out_and_back">Out and back</option><option value="point_to_point">Point to point</option><option value="network">Network</option></select></label><label>Import format <select name="importFormat"><option value="gpx">GPX</option><option value="geojson">GeoJSON LineString</option></select></label><label>Route file <input id="routeFile" type="file" accept=".gpx,.geojson,application/gpx+xml,application/geo+json" required></label><label>Source type <select name="sourceType"><option value="gpx">GPX</option><option value="geojson">GeoJSON</option><option value="openstreetmap">OpenStreetMap</option><option value="municipal_gis">Official municipal GIS</option><option value="manual">Manual admin route</option></select></label><label>Traceable source URL or identifier <input name="sourceIdentifier" required></label><label><input name="adminVerified" type="checkbox"> I inspected the preview and verified it matches this trail</label><button>Validate and preview</button></form><p id="adminStatus" role="status"></p><div id="adminMap" class="trail-detail-map"></div><section id="savedRoutes"></section></main><script src="auth-state-runtime.js"></script><script type="module" src="admin-trail-routes.js"></script></body></html>
