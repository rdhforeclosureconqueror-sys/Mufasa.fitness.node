<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Unleash the Beast — Push-Up Arena</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#050505;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif}
    body{display:flex;flex-direction:column}
    header{min-height:64px;padding:max(12px,env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #2a2a2a;background:#0b0b0b}
    h1{font-size:clamp(18px,4vw,28px);margin:0}
    .exit{color:#fff;text-decoration:none;border:1px solid #555;border-radius:10px;padding:10px 14px;flex-shrink:0}
    .stage{position:relative;flex:1;min-height:0}
    .status{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
    .card{max-width:620px;background:#111;border:1px solid #333;border-radius:16px;padding:24px;box-shadow:0 18px 60px #000}
    .card p{color:#ccc;line-height:1.5}
    .error{color:#ffb4b4!important}
    .game{width:100%;height:100%;border:0;display:none;background:#000}
    button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
    button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #74ecdf;outline-offset:3px}
    footer{padding:8px 14px calc(8px + env(safe-area-inset-bottom));font-size:12px;color:#999;background:#0b0b0b}
    #bridgeDebugToggle{position:fixed;z-index:99998;right:14px;bottom:max(48px,calc(14px + env(safe-area-inset-bottom)));border:1px solid #765f1e;background:#17130a;color:#ffd35a;border-radius:999px;padding:12px 16px;box-shadow:0 10px 32px #000a;font:800 13px system-ui}
    #bridgeDebugBoard{position:fixed;z-index:99999;right:12px;bottom:max(100px,calc(64px + env(safe-area-inset-bottom)));width:min(500px,calc(100vw - 24px));max-height:min(72vh,720px);max-height:min(72dvh,720px);overflow:auto;overscroll-behavior:contain;background:#090b10fa;border:1px solid #39455a;border-radius:18px;box-shadow:0 26px 80px #000d;padding:16px;color:#f6f8fb;backdrop-filter:blur(14px);font:13px/1.45 system-ui}
    #bridgeDebugBoard[hidden]{display:none}
    #bridgeDebugBoard h2{font-size:20px;color:#ffd35a;margin:0 0 4px}
    #bridgeDebugBoard h3{font-size:14px;margin:18px 0 8px;color:#dce4f2}
    #bridgeDebugBoard .dbg-sub{margin:0 0 10px;color:#abb7ca}
    #bridgeDebugBoard .dbg-first{padding:12px;border:1px solid #76622e;background:#211b0d;border-radius:10px;margin:12px 0}
    #bridgeDebugBoard .dbg-first.fail{border-color:#a8485c;background:#2b1117;color:#ffc0c9}
    #bridgeDebugBoard ol{list-style:none;padding:0;margin:0;display:grid;gap:8px}
    #bridgeDebugBoard li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;border:1px solid #293244;border-radius:10px;padding:10px;background:#0d1119}
    #bridgeDebugBoard .dbg-state{font-weight:900;font-size:11px;letter-spacing:.025em;overflow-wrap:anywhere}
    #bridgeDebugBoard .dbg-WAITING{color:#b4bfd0}
    #bridgeDebugBoard .dbg-RUNNING,#bridgeDebugBoard .dbg-NOT_CONNECTED{color:#ffd35a}
    #bridgeDebugBoard .dbg-PASS{color:#4ee19a}
    #bridgeDebugBoard .dbg-FAIL{color:#ff8198}
    #bridgeDebugBoard .dbg-SKIP{color:#a7caff}
    #bridgeDebugBoard .dbg-BLOCKED{color:#c3a3ed}
    #bridgeDebugBoard small{display:block;color:#abb7ca;margin-top:4px;overflow-wrap:anywhere}
    #bridgeDebugBoard .dbg-next{color:#ded8bb}
    #bridgeDebugBoard .dbg-note{margin-top:16px}
    #bridgeDebugBoard .dbg-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
    #bridgeDebugBoard .dbg-actions button{min-height:44px;padding:8px 12px;background:#20283a;border:1px solid #52617a;color:#fff;border-radius:8px;font-size:12px}
    #bridgeDebugBoard textarea{width:100%;min-height:180px;max-height:240px;background:#131925;color:#fff;border:1px solid #62708b;border-radius:8px;padding:10px}
    @media(max-width:600px){#bridgeDebugBoard{right:8px;width:calc(100vw - 16px);padding:12px}#bridgeDebugBoard li{grid-template-columns:88px minmax(0,1fr);gap:8px}}
    [hidden]{display:none!important}
    .stage{min-height:260px}
    #bridgeDebugToggle{position:static;align-self:flex-end;margin:8px 14px}
    .phone-panel{padding:14px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));background:#10131a;border-top:1px solid #3d4655}
    .phone-panel h2{font-size:20px;margin:0 0 6px;color:#ffd35a}
    .phone-panel p{margin:6px 0 12px;line-height:1.45;color:#dae0eb;max-width:760px}
    .phone-actions{display:flex;gap:8px;flex-wrap:wrap}
    .phone-panel button,.phone-panel select{min-height:48px;background:#253047;color:#fff;border:1px solid #546581;border-radius:10px;padding:12px 16px;font-size:14px}
    .phone-panel button.primary{background:#ffd35a;color:#15110a;border-color:#ffd35a}
    .phone-panel button:disabled{opacity:.5;cursor:default}
    .phone-panel select{max-width:100%}
    .thumb-controls{margin-top:12px;max-width:300px}
    .thumb-controls summary{padding:12px 0;cursor:pointer}
    .thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .thumb-grid button{touch-action:none;user-select:none;font-size:20px}
    .thumb-grid .forward{grid-column:2}.thumb-grid .left{grid-column:1}.thumb-grid .back{grid-column:2}
    .camera-stage{position:absolute;inset:0;background:#080b10}
    .camera-stage video{width:100%;height:100%;object-fit:contain}
    .camera-guide{position:absolute;inset:8%;border:2px dashed #ffd35a88;border-radius:20px;pointer-events:none}
    #arenaBodyStatus{position:absolute;left:12px;right:12px;bottom:10px;background:#111e;padding:8px 12px;border-radius:8px;color:#ffd35a;font-size:14px;text-align:center}
    #arenaBodyStatus[data-visible="true"]{color:#4ee19a}
    #arenaCameraChoice{margin-top:12px}#arenaCameraChoice label{display:block;margin-bottom:6px}
    @media(max-width:600px){header{align-items:flex-start}h1{font-size:18px}.phone-panel{padding-top:12px}.phone-actions button{flex:1 1 140px}.stage{min-height:240px}}
  </style>
  <script defer src="/runtime-state.js"></script>
  <script defer src="/push-up-challenge.js"></script>
  <script defer src="/arena-diagnostics.js?v=20260903-arena-diagnostics-v1"></script>
  <script defer src="/arena-phone-flow.js?v=20260903-phone-v1"></script>
  <script defer src="/arena-camera.js?v=20260903-phone-v1"></script>
  <script defer src="/arena-phone-ui.js?v=20260903-phone-v1"></script>
  <script defer src="/arena-push-up.js?v=20260903-arena-diagnostics-v1"></script>
</head>
<body>
  <header><h1>UNLEASH THE BEAST — PUSH-UP ARENA</h1><a id="exitArena" data-arena-exit class="exit" href="/push-up-challenge.html">Exit Arena</a></header>
  <main class="stage">
    <div id="status" class="status"><div class="card"><h2>Connecting to PocketPT…</h2><p id="message">Securing your arena session.</p></div></div>
    <iframe id="game" class="game" title="Unleash the Beast Godot arena" allow="fullscreen; gamepad"></iframe>
    <section id="arenaCameraStage" class="camera-stage" hidden aria-label="Camera framing preview">
      <video id="arenaCameraVideo" muted playsinline aria-label="Your live camera preview"></video>
      <div class="camera-guide" aria-hidden="true"></div>
      <p id="arenaBodyStatus" role="status">Waiting for a clear full-body view</p>
    </section>
  </main>
  <section id="arenaPhonePanel" class="phone-panel" hidden aria-labelledby="arenaPhoneTitle">
    <h2 id="arenaPhoneTitle">Enter the Lion’s Den</h2>
    <p id="arenaPhoneMessage" role="status" tabindex="-1">Connecting your gym session…</p>
    <div class="phone-actions">
      <button id="arenaGoToMat" class="primary" type="button" disabled>Go to mat</button>
      <button id="arenaStopApproach" type="button" hidden>Stop walking</button>
      <button id="arenaSetupCamera" type="button" hidden>Check my camera</button>
      <button id="arenaRepeatBriefing" type="button" hidden>Read briefing again</button>
      <button id="arenaEnableCamera" class="primary" type="button" hidden>Enable camera</button>
      <button id="arenaReturnToGym" type="button" hidden>Return to gym</button>
    </div>
    <details id="arenaThumbControls" class="thumb-controls" hidden><summary>Move with thumb controls</summary>
      <div class="thumb-grid" aria-label="Avatar movement">
        <button type="button" class="forward" data-arena-move="MOVE_FORWARD" aria-label="Move forward">↑</button>
        <button type="button" class="left" data-arena-move="MOVE_LEFT" aria-label="Move left">←</button>
        <button type="button" id="arenaThumbStop" aria-label="Stop movement">■</button>
        <button type="button" data-arena-move="MOVE_RIGHT" aria-label="Move right">→</button>
        <button type="button" class="back" data-arena-move="MOVE_BACKWARD" aria-label="Move backward">↓</button>
      </div>
    </details>
    <div id="arenaCameraChoice" hidden><label for="arenaCameraSelect">Choose camera</label><select id="arenaCameraSelect"></select></div>
  </section>
  <footer>PocketPTWorldProtocol v1 · Camera access does not start automatically.</footer>
  <button id="bridgeDebugToggle" type="button" aria-controls="bridgeDebugBoard" aria-expanded="false">Arena Diagnostics</button>
  <aside id="bridgeDebugBoard" hidden aria-label="PocketPT arena diagnostics"></aside>
  <noscript>JavaScript is required to connect the arena. Return to the Push-Up Challenge using Exit Arena.</noscript>
</body>
</html>
