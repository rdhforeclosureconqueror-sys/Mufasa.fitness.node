<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Community Wellness | Milele Fit</title>
<style>:root{--ink:#12120f;--gold:#d5b76d;--cream:#f6f0e6;--muted:#d5d0c5}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--cream);font:16px/1.55 system-ui,Arial,sans-serif}.shell{max-width:760px;margin:auto;padding:32px 20px 70px}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(2.5rem,7vw,4.8rem);line-height:1}.gold{color:var(--gold)}.panel{border:1px solid #6e5a32;border-radius:16px;padding:24px;background:#1b1a15}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid #6e5a32;border-radius:10px;padding:14px;background:#232119}.choice input{margin-top:5px}.consent{display:flex;gap:10px;margin:18px 0}.btn{border:1px solid var(--gold);border-radius:40px;padding:13px 24px;background:linear-gradient(120deg,#f2d996,#c49b4c);font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.muted{color:var(--muted)}#success{border:1px solid var(--gold);border-radius:16px;padding:28px;background:#201f19}a{color:var(--gold)}@media(max-width:560px){.choices{grid-template-columns:1fr}}</style></head><body><main class="shell"><p class="gold">MILELE FIT · COMMUNITY WELLNESS</p><section id="intake"><h1>What would help you <span class="gold">feel better?</span></h1><p>Select everything you're interested in. You can change this later.</p><form id="wellnessForm" class="panel"><div class="choices">
<label class="choice"><input type="checkbox" name="interest" value="run_walk"><span><strong>Run & Walk Club</strong><br><small>Free community meetups.</small></span></label>
<label class="choice"><input type="checkbox" name="interest" value="yoga"><span><strong>Yoga</strong><br><small>Inclusive group flows.</small></span></label>
<label class="choice"><input type="checkbox" name="interest" value="sound_bath"><span><strong>Sound Bath</strong><br><small>Guided relaxation experiences.</small></span></label>
<label class="choice"><input type="checkbox" name="interest" value="meditation_breathwork"><span><strong>Meditation & Breathwork</strong><br><small>Guided reset sessions.</small></span></label>
<label class="choice"><input type="checkbox" name="interest" value="mobility"><span><strong>Mobility & Stretching</strong><br><small>Move and recover better.</small></span></label>
<label class="choice"><input type="checkbox" name="interest" value="personal_training"><span><strong>Personal Training</strong><br><small>One-on-one coaching.</small></span></label>
<label class="choice"><input type="checkbox" name="interest" value="general_wellness"><span><strong>Community Wellness</strong><br><small>Keep me informed about new experiences.</small></span></label>
</div><label class="consent"><input required type="checkbox" id="communicationConsent"><span>I agree to receive Milele Fit wellness and event updates related to my selected interests.</span></label>
<label class="consent"><input type="checkbox" id="communityInviteConsent"><span>I'd like an invitation to the community group/chat when available.</span></label>
<button class="btn" id="submit" type="submit">Join Community Wellness →</button><p id="status" role="status" aria-live="polite"></p></form></section>
<section id="success" hidden><p class="gold">YOU'RE IN</p><h2>Welcome to Milele Fit Community Wellness.</h2><p id="summary"></p><p id="runNext" hidden><a class="btn" href="/free-run-club.html">Continue to Free Run Club →</a></p><p><a href="/apartment-wellness.html">Back to Community Wellness</a></p></section></main><script src="/residential-wellness.js?v=20261006-v1"></script></body></html>
